<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Showly</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d14; color: #e8e8f0; font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  input, select, textarea, button { font-family: 'DM Sans', sans-serif; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0d0d14; } ::-webkit-scrollbar-thumb { background: #252540; border-radius: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .fade { animation: fadeIn 0.3s ease; }
  .card { background: #1a1a2e; border: 1px solid #252540; border-radius: 12px; overflow: hidden; transition: border-color 0.2s, transform 0.2s; }
  .card:hover { border-color: #e9456060; transform: translateY(-1px); }
  .spinner { animation: spin 1s linear infinite; display: inline-block; }
  .tab-btn { background: none; border: none; cursor: pointer; color: #6060a0; border-bottom: 2px solid transparent; padding: 14px 13px; font-size: 12.5px; font-weight: 400; transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .tab-btn.active { color: #e8e8f0; border-bottom-color: #e94560; font-weight: 600; }
  .btn { border: none; cursor: pointer; border-radius: 6px; font-weight: 600; transition: opacity 0.15s; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-accent { background: #e94560; color: #fff; padding: 9px 20px; font-size: 13px; }
  .btn-blue { background: #0f3460; color: #fff; padding: 8px 16px; font-size: 13px; }
  .btn-ghost { background: none; border: 1px solid #252540 !important; color: #6060a0; padding: 8px 14px; font-size: 13px; }
  .btn-purple { background: #3d1f5e; border: 1px solid #9b59b640 !important; color: #c39bd3; padding: 6px 14px; font-size: 12px; }
  .btn-green { background: #2ecc71; color: #fff; padding: 7px 18px; font-size: 12px; font-weight: 700; }
  .input { background: #13131f; border: 1px solid #252540; color: #e8e8f0; padding: 9px 12px; border-radius: 6px; font-size: 13px; outline: none; width: 100%; }
  .input:focus { border-color: #e9456080; }
  .modal-overlay { position: fixed; inset: 0; background: #00000088; z-index: 200; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.15s ease; }
  .modal { background: #13131f; border: 1px solid #252540; border-radius: 12px; padding: 24px; box-shadow: 0 20px 60px #00000080; max-height: 85vh; overflow-y: auto; }
  .platform-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .platform-btn { background: #1a1a2e; border: 1px solid #252540; color: #6060a0; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 400; transition: all 0.15s; text-align: left; }
  .platform-btn.selected { background: #0f3460; border-color: #1a5296; color: #fff; font-weight: 600; }
  .progress-bar-track { flex: 1; height: 3px; background: #252540; border-radius: 2px; }
  .progress-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .ep-row { display: grid; grid-template-columns: 36px 50px 1fr; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid #25254015; transition: background 0.15s; cursor: pointer; }
  .ep-row:hover { background: #25254020; }
  .ep-row.watched { background: #1a2e1a18; }
  .ep-row.watched:hover { background: #1a2e1a30; }
  .ep-check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #252540; background: transparent; color: #6060a0; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .ep-check.watched { border-color: #2ecc71; background: #2ecc7125; color: #2ecc71; }
  .badge { border-radius: 4px; padding: 1px 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; white-space: nowrap; }
  .cover { border-radius: 6px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-box { background: #13131f; border: 1px solid #252540; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; }
  .empty-state { text-align: center; padding: 80px 0; color: #6060a0; }
  .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL = 'https://jtnkwzzaubkvqszjrrak.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0bmt3enphdWJrdnFzempycmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMzgxMjYsImV4cCI6MjA4ODgxNDEyNn0.UhKOw3DulX38GvYErlAo0gejoFtWfn1_bpHRPOrw8-4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const PLATFORMS = ["Netflix","HBO / Max","Disney+","Apple TV+","Hulu","Amazon Prime Video","Peacock","Paramount+","AMC+","Showtime","Crunchyroll","YouTube Premium","Other"];
const STATUS_META = {
  Watching:  { color: "#0f3460", bright: "#4a9eff", icon: "▶" },
  Watched:   { color: "#1a3d2b", bright: "#2ecc71", icon: "✓" },
  Paused:    { color: "#2e1a3e", bright: "#c39bd3", icon: "⏸" },
  Watchlist: { color: "#3d2b00", bright: "#f39c12", icon: "◉" },
  Dropped:   { color: "#3a0a0a", bright: "#e94560", icon: "✕" },
};
const COVER_PALETTES = [
  ["#e94560","#0f3460"],["#9b59b6","#1a0a2e"],["#2ecc71","#0a2e1a"],
  ["#f39c12","#2e1a00"],["#4a9eff","#0a1a2e"],["#e67e22","#2e0f00"],
  ["#1abc9c","#002e28"],["#e91e8c","#2e0020"],
];

// ── State ────────────────────────────────────────────────────────────────────
let state = { tab: 'watching', shows: [], user: null, session: null, apiKey: '', loaded: false };
let saveTimeout = null;

function setState(patch) {
  Object.assign(state, typeof patch === 'function' ? patch(state) : patch);
  render();
  if (patch.shows !== undefined || (typeof patch === 'function')) scheduleSave();
}

function scheduleSave() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveShows, 800);
}

// ── Supabase ─────────────────────────────────────────────────────────────────
async function loadShows() {
  if (!state.user) return;
  const { data } = await sb.from('shows').select('id, data').eq('user_id', state.user.id);
  if (data) setState({ shows: data.map(r => r.data), loaded: true });
  else setState({ loaded: true });
}

async function saveShows() {
  if (!state.user || !state.loaded) return;
  const rows = state.shows.map(s => ({ id: s.id, user_id: state.user.id, data: s, updated_at: new Date().toISOString() }));
  // Delete removed shows then upsert all
  const ids = rows.map(r => r.id);
  await sb.from('shows').delete().eq('user_id', state.user.id).not('id', 'in', ids.length ? `(${ids.map(i=>`"${i}"`).join(',')})` : '("")');
  if (rows.length) await sb.from('shows').upsert(rows, { onConflict: 'id,user_id' });
}

async function upsertShow(show) {
  setState(s => ({ shows: s.shows.find(x => x.id === show.id) ? s.shows.map(x => x.id === show.id ? show : x) : [...s.shows, show] }));
  if (!state.user) return;
  await sb.from('shows').upsert({ id: show.id, user_id: state.user.id, data: show, updated_at: new Date().toISOString() }, { onConflict: 'id,user_id' });
}

async function removeShow(id) {
  setState(s => ({ shows: s.shows.filter(x => x.id !== id) }));
  if (!state.user) return;
  await sb.from('shows').delete().eq('id', id).eq('user_id', state.user.id);
}

// ── Claude ───────────────────────────────────────────────────────────────────
async function askClaude(prompt) {
  const key = state.apiKey || localStorage.getItem('showly_api_key') || '';
  if (!key) throw new Error('No API key');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 4000, messages: [{ role: 'user', content: prompt }] }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const text = data.content?.map(b => b.text || '').join('') || '';
  return text.replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```\s*$/,'').trim();
}

function parseJSON(raw) {
  try { return JSON.parse(raw); } catch {
    const m = raw.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
    if (m) try { return JSON.parse(m[1]); } catch {}
    return null;
  }
}

async function loadEpisodesForShow(show) {
  const raw = await askClaude(
    `List every season and episode of the TV show "${show.title}"${show.years ? ` (${show.years})` : ''}. ` +
    `Return ONLY valid JSON, no markdown, no explanation. Format: ` +
    `{"seasons":[{"number":1,"episodes":[{"number":1,"title":"Pilot","runtime":47},{"number":2,"title":"Cat's in the Bag","runtime":48}]},{"number":2,"episodes":[{"number":1,"title":"Seven Thirty-Seven","runtime":47}]}]}`
  );
  const data = parseJSON(raw);
  if (!data?.seasons) throw new Error('Bad response');
  return { episodeData: data.seasons, totalEpisodes: data.seasons.reduce((a,s) => a + s.episodes.length, 0) };
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function hashStr(s) { let h=0; for(let i=0;i<s.length;i++) h=(Math.imul(31,h)+s.charCodeAt(i))|0; return Math.abs(h); }

function coverStyle(title, size) {
  const [a, b] = COVER_PALETTES[hashStr(title) % COVER_PALETTES.length];
  return `width:${size}px;height:${size*1.5}px;background:linear-gradient(145deg,${a},${b});border-radius:6px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:${size*0.06}px;overflow:hidden;position:relative;`;
}

function coverHTML(show, size=80) {
  const words = show.title.trim().split(/\s+/);
  const initials = words.length===1 ? words[0].slice(0,2).toUpperCase() : words.slice(0,2).map(w=>w[0].toUpperCase()).join('');
  const fs = size*0.28;
  return `<div style="${coverStyle(show.title, size)}">
    <span style="font-size:${size*0.7}px;position:absolute;top:${size*0.05}px;right:-${size*0.1}px;opacity:0.12;">📺</span>
    <span style="font-size:${fs*1.3}px;font-weight:900;color:#fff;font-family:'Playfair Display',serif;z-index:1;text-shadow:0 2px 8px #0008;">${initials}</span>
    <span style="font-size:${fs*0.62}px;color:rgba(255,255,255,0.7);font-weight:600;z-index:1;text-align:center;padding:0 ${size*0.08}px;overflow:hidden;white-space:nowrap;max-width:100%;text-overflow:ellipsis;">${show.title}</span>
    ${show.years ? `<span style="font-size:${fs*0.5}px;color:rgba(255,255,255,0.4);z-index:1;">${show.years}</span>` : ''}
  </div>`;
}

function getNextEpisode(show) {
  if (!show.episodeData) return null;
  for (const season of show.episodeData) {
    for (let i=0; i<season.episodes.length; i++) {
      const key = `${season.number}-${i+1}`;
      if (!show.watchedEps?.[key]) return { season: season.number, episode: i+1, title: season.episodes[i].title, runtime: season.episodes[i].runtime };
    }
  }
  return null;
}

function getPausedAt(show) {
  if (show.pauseEpisode) return show.pauseEpisode;
  if (!show.episodeData) return null;
  let last = null;
  for (const season of show.episodeData) {
    for (let i=0; i<season.episodes.length; i++) {
      const key = `${season.number}-${i+1}`;
      if (show.watchedEps?.[key]) last = { season: season.number, episode: i+1, title: season.episodes[i].title };
    }
  }
  return last;
}

function pad(n) { return String(n).padStart(2,'0'); }

function progressBar(watched, total) {
  if (!total) return '';
  const pct = Math.min(100, Math.round((watched/total)*100));
  const color = pct===100 ? '#2ecc71' : '#e94560';
  return `<div style="display:flex;align-items:center;gap:8px;">
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%;background:${color};"></div></div>
    <span style="font-size:11px;color:#6060a0;min-width:32px;text-align:right;">${pct}%</span>
  </div>`;
}

function badge(label, color, bright) {
  return `<span class="badge" style="background:${color};color:${bright};border:1px solid ${bright}50;">${label}</span>`;
}

// ── Modals (imperative) ───────────────────────────────────────────────────────
function showModal(html, onClose) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = html;
  overlay.addEventListener('click', e => { if (e.target === overlay) { overlay.remove(); onClose && onClose(); } });
  document.body.appendChild(overlay);
  return overlay;
}

function platformModal(show, title, onConfirm) {
  return new Promise(resolve => {
    const btns = PLATFORMS.map(p => `<button class="platform-btn${(show.watchingOn||show.platform)===p?' selected':''}" data-p="${p}">${p}</button>`).join('');
    const overlay = showModal(`
      <div class="modal" style="width:340px;max-width:90vw;" onclick="event.stopPropagation()">
        <h3 style="font-family:'Playfair Display',serif;font-size:18px;margin-bottom:6px;">${title}</h3>
        <div style="color:#6060a0;font-size:13px;margin-bottom:18px;">Where are you watching <strong style="color:#e8e8f0;">${show.title}</strong>?</div>
        <div class="platform-grid">${btns}</div>
        <div id="custom-wrap" style="display:none;margin-bottom:14px;"><input class="input" id="custom-input" placeholder="Platform name…" /></div>
        <div style="display:flex;gap:8px;margin-top:4px;">
          <button class="btn btn-accent" id="confirm-btn" style="flex:1;">▶ ${title}</button>
          <button class="btn btn-ghost" id="cancel-btn">Cancel</button>
        </div>
      </div>`, () => resolve(null));
    let sel = show.watchingOn || show.platform || '';
    overlay.querySelectorAll('.platform-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        sel = btn.dataset.p;
        overlay.querySelectorAll('.platform-btn').forEach(b => b.classList.toggle('selected', b.dataset.p === sel));
        document.getElementById('custom-wrap').style.display = sel==='Other' ? 'block' : 'none';
        if (sel==='Other') document.getElementById('custom-input').focus();
      });
    });
    document.getElementById('confirm-btn').addEventListener('click', () => {
      const val = sel==='Other' ? (document.getElementById('custom-input').value.trim()||'Other') : sel;
      overlay.remove(); resolve(val);
    });
    document.getElementById('cancel-btn').addEventListener('click', () => { overlay.remove(); resolve(null); });
  });
}

function pauseModal(show) {
  return new Promise(resolve => {
    const next = getNextEpisode(show);
    const ph = next ? `e.g. S${pad(next.season)}E${pad(next.episode)} — ${next.title}` : 'e.g. Season 2, Episode 4…';
    const overlay = showModal(`
      <div class="modal" style="width:340px;max-width:90vw;" onclick="event.stopPropagation()">
        <h3 style="font-family:'Playfair Display',serif;font-size:18px;margin-bottom:6px;">Pause Show</h3>
        <div style="color:#6060a0;font-size:13px;margin-bottom:18px;">Pausing <strong style="color:#e8e8f0;">${show.title}</strong>. Add a note to remember where you left off.</div>
        <input class="input" id="pause-note" placeholder="${ph}" style="margin-bottom:16px;" />
        <div style="display:flex;gap:8px;">
          <button class="btn btn-purple" id="pause-btn" style="flex:1;font-size:14px;">⏸ Pause</button>
          <button class="btn btn-ghost" id="cancel-btn">Cancel</button>
        </div>
      </div>`, () => resolve(null));
    document.getElementById('pause-note').focus();
    document.getElementById('pause-note').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('pause-btn').click(); });
    document.getElementById('pause-btn').addEventListener('click', () => { const note = document.getElementById('pause-note').value.trim(); overlay.remove(); resolve({ note }); });
    document.getElementById('cancel-btn').addEventListener('click', () => { overlay.remove(); resolve(null); });
  });
}

function disambigModal(matches) {
  return new Promise(resolve => {
    const items = matches.map((m,i) => `
      <div class="card" data-i="${i}" style="padding:12px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;border-radius:8px;">
        ${coverHTML(m, 36)}
        <div style="flex:1;">
          <div style="font-family:'Playfair Display',serif;font-size:15px;margin-bottom:3px;">${m.title}</div>
          <div style="font-size:12px;color:#6060a0;">${[m.years,m.genre,m.network].filter(Boolean).join(' · ')}</div>
          ${m.description ? `<div style="font-size:11px;color:#6060a0;font-style:italic;margin-top:3px;">${m.description}</div>` : ''}
        </div>
        <span style="color:#e94560;font-size:18px;">→</span>
      </div>`).join('');
    const overlay = showModal(`
      <div class="modal" style="width:420px;max-width:92vw;" onclick="event.stopPropagation()">
        <h3 style="font-family:'Playfair Display',serif;font-size:18px;margin-bottom:6px;">Multiple Matches Found</h3>
        <div style="color:#6060a0;font-size:13px;margin-bottom:18px;">Which show did you mean?</div>
        <div style="display:flex;flex-direction:column;gap:10px;" id="match-list">${items}</div>
        <button class="btn btn-ghost" style="width:100%;margin-top:14px;" id="cancel-btn">Cancel</button>
      </div>`, () => resolve(null));
    overlay.querySelectorAll('[data-i]').forEach(el => {
      el.addEventListener('mouseenter', () => el.style.borderColor='#e9456060');
      el.addEventListener('mouseleave', () => el.style.borderColor='#252540');
      el.addEventListener('click', () => { overlay.remove(); resolve(matches[+el.dataset.i]); });
    });
    document.getElementById('cancel-btn').addEventListener('click', () => { overlay.remove(); resolve(null); });
  });
}

function apiKeyModal() {
  return new Promise(resolve => {
    const overlay = showModal(`
      <div class="modal" style="width:380px;max-width:92vw;" onclick="event.stopPropagation()">
        <h3 style="font-family:'Playfair Display',serif;font-size:18px;margin-bottom:6px;">Anthropic API Key</h3>
        <div style="color:#6060a0;font-size:13px;margin-bottom:18px;">Enter your Anthropic API key to enable AI features. It's stored locally in your browser only.</div>
        <input class="input" id="api-key-input" type="password" placeholder="sk-ant-..." style="margin-bottom:16px;" />
        <button class="btn btn-accent" id="save-btn" style="width:100%;">Save Key</button>
      </div>`, () => resolve(null));
    document.getElementById('api-key-input').focus();
    document.getElementById('api-key-input').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('save-btn').click(); });
    document.getElementById('save-btn').addEventListener('click', () => {
      const key = document.getElementById('api-key-input').value.trim();
      if (!key) return;
      localStorage.setItem('showly_api_key', key);
      state.apiKey = key;
      overlay.remove(); resolve(key);
    });
  });
}

// ── Add Show Flow ─────────────────────────────────────────────────────────────
async function addShowFlow(defaultStatus='Watching') {
  const apiKey = state.apiKey || localStorage.getItem('showly_api_key') || '';
  if (!apiKey) { await apiKeyModal(); }

  return new Promise(resolve => {
    const overlay = showModal(`
      <div class="modal" style="width:380px;max-width:92vw;" onclick="event.stopPropagation()">
        <h3 style="font-family:'Playfair Display',serif;font-size:18px;margin-bottom:16px;">Add Show</h3>
        <input class="input" id="show-title-input" placeholder="Show title…" style="margin-bottom:12px;" />
        <div id="add-error" style="color:#e94560;font-size:12px;min-height:16px;margin-bottom:8px;"></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-accent" id="search-btn" style="flex:1;">Next →</button>
          <button class="btn btn-ghost" id="cancel-btn">✕</button>
        </div>
        <div id="add-spinner" style="margin-top:10px;display:none;color:#6060a0;font-size:12px;"><span class="spinner">⟳</span> Searching…</div>
      </div>`, () => resolve(null));

    document.getElementById('show-title-input').focus();
    document.getElementById('show-title-input').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('search-btn').click(); });
    document.getElementById('cancel-btn').addEventListener('click', () => { overlay.remove(); resolve(null); });
    document.getElementById('search-btn').addEventListener('click', async () => {
      const title = document.getElementById('show-title-input').value.trim();
      if (!title) return;
      document.getElementById('search-btn').disabled = true;
      document.getElementById('add-spinner').style.display = 'block';
      document.getElementById('add-error').textContent = '';
      try {
        const raw = await askClaude(
          `Are there multiple distinct TV shows named "${title}"? ` +
          `Return ONLY a valid JSON array, no markdown: [{"title":"...","years":"...","genre":"...","network":"...","description":"one sentence"}]. ` +
          `If only one show matches return array with one item. Include 2-5 items only if genuinely different shows share the name.`
        );
        const results = parseJSON(raw);
        if (!results?.length) throw new Error('No results');
        overlay.remove();
        let picked = results[0];
        if (results.length > 1) {
          picked = await disambigModal(results);
          if (!picked) { resolve(null); return; }
        }
        if (defaultStatus === 'Watching') {
          const platform = await platformModal(picked, 'Start Watching');
          if (platform === null) { resolve(null); return; }
          picked.watchingOn = platform;
        }
        const show = {
          id: Date.now().toString(), title: picked.title, genre: picked.genre||'',
          network: picked.network||'', years: picked.years||'', description: picked.description||'',
          status: defaultStatus, watchingOn: picked.watchingOn||'',
          totalEpisodes: '', episodesWatched: 0, episodeData: null, watchedEps: {}, pauseNote: '', pauseEpisode: null,
        };
        await upsertShow(show);
        resolve(show);
      } catch(e) {
        document.getElementById('add-error').textContent = e.message.includes('API key') ? 'Invalid or missing API key.' : "Couldn't find that show. Try a different title.";
        document.getElementById('search-btn').disabled = false;
        document.getElementById('add-spinner').style.display = 'none';
      }
    });
  });
}

// ── Event Handlers ────────────────────────────────────────────────────────────
window.handleMarkWatched = async (id) => {
  const show = state.shows.find(s => s.id === id);
  if (!show) return;
  const next = getNextEpisode(show);
  if (!next) return;
  const key = `${next.season}-${next.episode}`;
  const watchedEps = { ...show.watchedEps, [key]: true };
  await upsertShow({ ...show, watchedEps, episodesWatched: Object.values(watchedEps).filter(Boolean).length });
};

window.handleLoadEps = async (id) => {
  const show = state.shows.find(s => s.id === id);
  if (!show) return;
  const btn = document.querySelector(`#card-${id} button[onclick*="handleLoadEps"]`);
  if (btn) { btn.textContent = '⟳ Loading…'; btn.disabled = true; }
  try {
    const updates = await loadEpisodesForShow(show);
    await upsertShow({ ...show, ...updates });
  } catch { if (btn) { btn.textContent = '⬇ Load Episodes'; btn.disabled = false; } }
};

window.handlePause = async (id) => {
  const show = state.shows.find(s => s.id === id);
  if (!show) return;
  const result = await pauseModal(show);
  if (result === null) return;
  const next = getNextEpisode(show);
  const pauseEp = next ? { season: next.season, episode: next.episode, title: next.title } : null;
  await upsertShow({ ...show, status: 'Paused', pauseNote: result.note, pauseEpisode: pauseEp });
};

window.handleResume = async (id) => {
  const show = state.shows.find(s => s.id === id);
  if (!show) return;
  const platform = await platformModal(show, 'Resume Watching');
  if (platform === null) return;
  await upsertShow({ ...show, status: 'Watching', watchingOn: platform, pauseEpisode: null, pauseNote: '' });
};

window.handleRemove = async (id) => {
  if (!confirm('Remove this show?')) return;
  await removeShow(id);
};

window.handleStartFromWatchlist = async (id) => {
  const show = state.shows.find(s => s.id === id);
  if (!show) return;
  const platform = await platformModal(show, 'Start Watching');
  if (platform === null) return;
  await upsertShow({ ...show, status: 'Watching', watchingOn: platform });
};

window.handleStatusChange = async (id, newStatus) => {
  const show = state.shows.find(s => s.id === id);
  if (!show) return;
  if (newStatus === 'Watching') {
    const platform = await platformModal(show, 'Start Watching');
    if (platform === null) { render(); return; }
    await upsertShow({ ...show, status: 'Watching', watchingOn: platform });
  } else {
    await upsertShow({ ...show, status: newStatus });
  }
};

window.handleToggleEp = async (showId, sn, en) => {
  const show = state.shows.find(s => s.id === showId);
  if (!show) return;
  const key = `${sn}-${en}`;
  const watchedEps = { ...show.watchedEps, [key]: !show.watchedEps?.[key] };
  await upsertShow({ ...show, watchedEps, episodesWatched: Object.values(watchedEps).filter(Boolean).length });
};

window.handleToggleAllEps = async (showId, seasonNum) => {
  const show = state.shows.find(s => s.id === showId);
  if (!show) return;
  const season = show.episodeData.find(s => s.number === seasonNum);
  if (!season) return;
  const nw = { ...show.watchedEps };
  const allW = season.episodes.every((_,i) => show.watchedEps?.[`${seasonNum}-${i+1}`]);
  season.episodes.forEach((_,i) => { nw[`${seasonNum}-${i+1}`] = !allW; });
  await upsertShow({ ...show, watchedEps: nw, episodesWatched: Object.values(nw).filter(Boolean).length });
};

window.handleLoadEpsDetail = async (showId) => {
  const show = state.shows.find(s => s.id === showId);
  if (!show) return;
  const btn = document.getElementById('load-eps-btn');
  if (btn) { btn.textContent = '⟳ Loading…'; btn.disabled = true; }
  const errEl = document.getElementById('ep-error');
  if (errEl) errEl.textContent = '';
  try {
    const updates = await loadEpisodesForShow(show);
    await upsertShow({ ...show, ...updates });
  } catch {
    if (errEl) errEl.textContent = 'Failed to load. Try again.';
    if (btn) { btn.textContent = 'Load Episodes'; btn.disabled = false; }
  }
};

window.handleSetSeason = (n) => { state.activeSeason = n; render(); };

window.handleSetDetailShow = (id) => { state.detailShowId = id; state.activeSeason = 1; render(); };

window.handleDetailSearch = async () => {
  const q = document.getElementById('detail-search-input')?.value?.trim();
  if (!q) return;
  const btn = document.getElementById('detail-search-btn');
  if (btn) { btn.textContent = '…'; btn.disabled = true; }
  try {
    const raw = await askClaude(`List 5 TV shows matching "${q}". Return ONLY a valid JSON array, no markdown: [{"title":"...","years":"...","genre":"...","network":"...","description":"one sentence"}]`);
    state.detailSearchResults = parseJSON(raw) || [];
  } catch { state.detailSearchResults = []; }
  if (btn) { btn.textContent = 'Search'; btn.disabled = false; }
  render();
};

window.handleDetailAddShow = async (i) => {
  const r = state.detailSearchResults[i];
  if (!r) return;
  const existing = state.shows.find(s => s.title.toLowerCase()===r.title.toLowerCase() && s.years===r.years);
  if (existing) { state.detailShowId = existing.id; state.activeSeason = 1; state.detailSearchResults = []; render(); return; }
  const show = { id: Date.now().toString(), title: r.title, genre: r.genre||'', network: r.network||'', years: r.years||'', description: r.description||'', status: 'Watchlist', totalEpisodes: '', episodesWatched: 0, episodeData: null, watchedEps: {}, pauseNote: '', pauseEpisode: null, watchingOn: '' };
  await upsertShow(show);
  state.detailShowId = show.id; state.activeSeason = 1; state.detailSearchResults = [];
  render();
  handleLoadEpsDetail(show.id);
};

window.handleSignOut = async () => { await sb.auth.signOut(); };
window.handleSetApiKey = async () => { await apiKeyModal(); };

// ── Auth UI ───────────────────────────────────────────────────────────────────
function renderAuth() {
  let mode = 'login';
  const app = document.getElementById('app');
  app.innerHTML = `<div class="auth-wrap">
    <div class="auth-box fade">
      <h1 style="font-family:'Playfair Display',serif;font-size:28px;color:#e94560;letter-spacing:1px;margin-bottom:4px;">SHOWLY</h1>
      <p style="color:#6060a0;font-size:13px;margin-bottom:28px;">Track every episode.</p>
      <div style="display:flex;gap:0;margin-bottom:24px;border-radius:8px;overflow:hidden;border:1px solid #252540;">
        <button id="mode-login" onclick="setAuthMode('login')" style="flex:1;padding:10px;background:#e94560;color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:600;">Sign In</button>
        <button id="mode-signup" onclick="setAuthMode('signup')" style="flex:1;padding:10px;background:#1a1a2e;color:#6060a0;border:none;cursor:pointer;font-size:13px;">Sign Up</button>
      </div>
      <input class="input" id="auth-email" type="email" placeholder="Email" style="margin-bottom:10px;" />
      <input class="input" id="auth-password" type="password" placeholder="Password" style="margin-bottom:10px;" />
      <div id="auth-error" style="color:#e94560;font-size:12px;min-height:16px;margin-bottom:10px;"></div>
      <button class="btn btn-accent" id="auth-submit" style="width:100%;padding:11px;" onclick="handleAuth()">Sign In</button>
    </div>
  </div>`;

  window.setAuthMode = (m) => {
    mode = m;
    document.getElementById('mode-login').style.background = m==='login' ? '#e94560' : '#1a1a2e';
    document.getElementById('mode-login').style.color = m==='login' ? '#fff' : '#6060a0';
    document.getElementById('mode-signup').style.background = m==='signup' ? '#e94560' : '#1a1a2e';
    document.getElementById('mode-signup').style.color = m==='signup' ? '#fff' : '#6060a0';
    document.getElementById('auth-submit').textContent = m==='login' ? 'Sign In' : 'Create Account';
  };

  window.handleAuth = async () => {
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const btn = document.getElementById('auth-submit');
    const err = document.getElementById('auth-error');
    if (!email || !password) { err.textContent = 'Please fill in all fields.'; return; }
    btn.disabled = true; btn.textContent = '…'; err.textContent = '';
    const fn = mode==='login' ? sb.auth.signInWithPassword.bind(sb.auth) : sb.auth.signUp.bind(sb.auth);
    const { error } = await fn({ email, password });
    if (error) { err.textContent = error.message; btn.disabled = false; btn.textContent = mode==='login' ? 'Sign In' : 'Create Account'; }
  };

  document.getElementById('auth-email').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('auth-password').focus(); });
  document.getElementById('auth-password').addEventListener('keydown', e => { if(e.key==='Enter') window.handleAuth(); });
}

// ── Main Render ───────────────────────────────────────────────────────────────
function render() {
  if (!state.user) { renderAuth(); return; }
  const { tab, shows } = state;
  const watchingCount = shows.filter(s => s.status==='Watching').length;
  const pausedCount = shows.filter(s => s.status==='Paused').length;

  const tabs = [
    { id:'watching', label:'▶ Watching', badge: watchingCount },
    { id:'paused',   label:'⏸ Paused',   badge: pausedCount },
    { id:'shows',    label:'📺 All Shows' },
    { id:'detail',   label:'🔍 Show Detail' },
    { id:'watchlist',label:'🔖 Watchlist' },
    { id:'stats',    label:'📊 Stats' },
  ];

  const tabNav = tabs.map(t => `
    <button class="tab-btn ${tab===t.id?'active':''}" onclick="setState({tab:'${t.id}'})">
      ${t.label}
      ${t.badge ? `<span style="background:${t.id==='paused'?'#3d1f5e':'#e94560'};color:${t.id==='paused'?'#c39bd3':'#fff'};border-radius:10px;font-size:10px;font-weight:700;padding:1px 6px;">${t.badge}</span>` : ''}
    </button>`).join('');

  let content = '';
  if (tab==='watching') content = renderWatchingTab();
  else if (tab==='paused') content = renderPausedTab();
  else if (tab==='shows') content = renderAllShowsTab();
  else if (tab==='detail') content = renderDetailTab();
  else if (tab==='watchlist') content = renderWatchlistTab();
  else if (tab==='stats') content = renderStatsTab();

  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;">
      <div style="background:#13131f;border-bottom:1px solid #252540;position:sticky;top:0;z-index:100;">
        <div style="max-width:1100px;margin:0 auto;padding:0 20px;display:flex;align-items:center;overflow-x:auto;">
          <h1 style="font-family:'Playfair Display',serif;font-size:20px;color:#e94560;letter-spacing:1px;padding:14px 20px 14px 0;flex-shrink:0;border-right:1px solid #252540;margin-right:4px;">SHOWLY</h1>
          ${tabNav}
          <div style="margin-left:auto;display:flex;gap:8px;padding-left:12px;flex-shrink:0;">
            <button class="btn btn-ghost" style="font-size:11px;padding:5px 10px;" onclick="handleSetApiKey()">🔑 API Key</button>
            <button class="btn btn-ghost" style="font-size:11px;padding:5px 10px;" onclick="handleSignOut()">Sign Out</button>
          </div>
        </div>
      </div>
      <div style="max-width:1100px;margin:0 auto;padding:28px 20px 60px;" class="fade">${content}</div>
    </div>`;
}

  return `
    <div class="section-header">
      <h2 style="font-family:'Playfair Display',serif;font-size:26px;">All Shows <span style="color:#6060a0;font-size:16px;font-weight:400;">(${state.shows.length})</span></h2>
      <button class="btn btn-accent" onclick="addShowFlow('Watching').then(s=>{if(s)render()})">+ Add Show</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">${statusBtns}</div>
    ${filtered.length===0 ? `<div class="empty-state"><div style="font-size:40px;margin-bottom:10px;">📭</div><div>No shows here yet</div></div>` : `<div style="display:grid;gap:10px;">${cards}</div>`}`;
}

function renderDetailTab() {
  const showId = state.detailShowId || '';
  const selected = state.shows.find(s => s.id===showId);
  const activeSeason = state.activeSeason || 1;
  const results = state.detailSearchResults || [];

  const selectOptions = state.shows.map(s => `<option value="${s.id}" ${s.id===showId?'selected':''}>${s.title}${s.years?` (${s.years})`:''}</option>`).join('');

  let detailContent = '';
  if (selected) {
    const seasonBtns = (selected.episodeData||[]).map(s => {
      const wc = s.episodes.filter((_,i) => selected.watchedEps?.[`${s.number}-${i+1}`]).length;
      const pct = Math.round(wc/s.episodes.length*100);
      return `<button onclick="handleSetSeason(${s.number})" style="background:${activeSeason===s.number?'#e94560':'#1a1a2e'};border:1px solid ${activeSeason===s.number?'#e94560':'#252540'};color:${activeSeason===s.number?'#fff':'#6060a0'};padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:2px;"><span>S${pad(s.number)}</span><span style="font-size:10px;opacity:0.7;">${pct}%</span></button>`;
    }).join('');

    const seasonData = (selected.episodeData||[]).find(s => s.number===activeSeason);
    const epRows = seasonData ? seasonData.episodes.map((ep,i) => {
      const epNum = i+1;
      const key = `${seasonData.number}-${epNum}`;
      const watched = !!selected.watchedEps?.[key];
      return `<div class="ep-row ${watched?'watched':''}" onclick="handleToggleEp('${selected.id}',${seasonData.number},${epNum})">
        <div class="ep-check ${watched?'watched':'}">${watched?'✓':'○'}</div>
        <span style="font-size:11px;color:#6060a0;font-weight:600;">E${pad(epNum)}</span>
        <div>
          <div style="font-size:13px;color:${watched?'#6060a0':'#e8e8f0'};font-weight:500;">${ep.title}</div>
          ${ep.runtime ? `<div style="font-size:11px;color:#6060a0;">${ep.runtime} min</div>` : ''}
        </div>
      </div>`;
    }).join('') : '';

    detailContent = `
      <div style="background:#1a1a2e;border:1px solid #252540;border-radius:10px;padding:18px 22px;margin-bottom:16px;display:flex;gap:16px;align-items:flex-start;">
        ${coverHTML(selected, 80)}
        <div style="flex:1;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
            <div>
              <h3 style="font-family:'Playfair Display',serif;font-size:22px;margin-bottom:6px;">${selected.title}</h3>
              <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#6060a0;">
                ${selected.watchingOn ? `<span style="color:#4a9eff;">📡 ${selected.watchingOn}</span>` : ''}
                ${selected.genre ? `<span>🎭 ${selected.genre}</span>` : ''}
                ${selected.years ? `<span>📅 ${selected.years}</span>` : ''}
                ${selected.totalEpisodes ? `<span style="color:#e94560;">${selected.episodesWatched||0} / ${selected.totalEpisodes} watched</span>` : ''}
              </div>
              ${selected.description ? `<div style="font-size:12px;color:#6060a0;font-style:italic;margin-top:6px;max-width:500px;">${selected.description}</div>` : ''}
            </div>
            <div>
              ${!selected.episodeData ? `<button class="btn btn-accent" id="load-eps-btn" onclick="handleLoadEpsDetail('${selected.id}')">Load Episodes</button>` : ''}
              <div id="ep-error" style="color:#e94560;font-size:12px;margin-top:6px;"></div>
            </div>
          </div>
        </div>
      </div>
      ${selected.episodeData ? `
        <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;">${seasonBtns}</div>
        ${seasonData ? `
          <div style="background:#1a1a2e;border:1px solid #252540;border-radius:10px;overflow:hidden;">
            <div style="padding:12px 18px;border-bottom:1px solid #252540;display:flex;justify-content:space-between;align-items:center;">
              <span style="font-family:'Playfair Display',serif;font-size:16px;">Season ${seasonData.number}</span>
              <div style="display:flex;gap:10px;align-items:center;">
                <span style="font-size:12px;color:#6060a0;">${seasonData.episodes.filter((_,i)=>selected.watchedEps?.[`${seasonData.number}-${i+1}`]).length}/${seasonData.episodes.length}</span>
                <button class="btn btn-ghost" style="font-size:11px;padding:4px 10px;" onclick="handleToggleAllEps('${selected.id}',${seasonData.number})">Toggle All</button>
              </div>
            </div>
            ${epRows}
          </div>` : ''}` : ''}`;
  }

  const searchResultsHTML = results.map((r,i) => `
    <div class="card" style="padding:12px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;border-radius:8px;" onclick="handleDetailAddShow(${i})">
      ${coverHTML(r, 32)}
      <div style="flex:1;">
        <div style="font-family:'Playfair Display',serif;font-size:15px;margin-bottom:2px;">${r.title}</div>
        <div style="font-size:12px;color:#6060a0;">${[r.network,r.genre,r.years].filter(Boolean).join(' · ')}</div>
      </div>
      <span style="color:#e94560;font-size:18px;">→</span>
    </div>`).join('');

  return `
    <h2 style="font-family:'Playfair Display',serif;font-size:26px;margin-bottom:18px;">Show Detail</h2>
    <div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;">
      <select onchange="handleSetDetailShow(this.value)" style="background:#1a1a2e;border:1px solid #252540;color:#e8e8f0;padding:9px 14px;border-radius:7px;font-size:14px;cursor:pointer;min-width:220px;">
        <option value="">— Pick a show —</option>${selectOptions}
      </select>
      <span style="color:#6060a0;align-self:center;font-size:12px;">or search</span>
      <div style="display:flex;gap:8px;flex:1;max-width:360px;">
        <input class="input" id="detail-search-input" placeholder="Search any show…" style="flex:1;" onkeydown="if(event.key==='Enter')handleDetailSearch()" />
        <button class="btn btn-accent" id="detail-search-btn" onclick="handleDetailSearch()">Search</button>
      </div>
    </div>
    ${results.length ? `<div style="margin-bottom:18px;display:grid;gap:8px;">${searchResultsHTML}</div>` : ''}
    ${selected ? detailContent : `<div class="empty-state"><div style="font-size:48px;margin-bottom:12px;">🔍</div><div>Select a show or search for any title</div></div>`}`;
}

function renderWatchlistTab() {
  const watchlist = state.shows.filter(s => s.status==='Watchlist');
  const cards = watchlist.map(show => `
    <div class="card" style="padding:14px 18px;display:flex;gap:14px;align-items:center;border-radius:10px;">
      ${coverHTML(show,56)}
      <div style="flex:1;">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:4px;flex-wrap:wrap;">
          <span style="font-family:'Playfair Display',serif;font-size:16px;font-weight:700;">${show.title}</span>
          ${show.years ? `<span style="color:#6060a0;font-size:11px;">${show.years}</span>` : ''}
        </div>
        <div style="font-size:12px;color:#6060a0;display:flex;gap:12px;flex-wrap:wrap;">
          ${show.network ? `<span>📡 ${show.network}</span>` : ''}
          ${show.genre ? `<span>🎭 ${show.genre}</span>` : ''}
        </div>
        ${show.description ? `<div style="font-size:11px;color:#6060a0;font-style:italic;margin-top:4px;max-width:500px;">${show.description}</div>` : ''}
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">
        <button class="btn btn-blue" onclick="handleStartFromWatchlist('${show.id}')">▶ Start</button>
        <button class="btn btn-ghost" style="font-size:11px;padding:6px 10px;" onclick="handleRemove('${show.id}')">✕</button>
      </div>
    </div>`).join('');
  return `
    <div class="section-header">
      <h2 style="font-family:'Playfair Display',serif;font-size:26px;">Watchlist <span style="color:#6060a0;font-size:16px;">(${watchlist.length})</span></h2>
      <button class="btn btn-accent" onclick="addShowFlow('Watchlist').then(s=>{if(s)render()})">+ Add</button>
    </div>
    ${watchlist.length===0 ? `<div class="empty-state"><div style="font-size:48px;margin-bottom:12px;">🔖</div><div>Your watchlist is empty</div></div>` : `<div style="display:grid;gap:10px;">${cards}</div>`}`;
}

function renderStatsTab() {
  const { shows } = state;
  const totalEps = shows.reduce((a,s) => a+(s.episodesWatched||0),0);
  const topWatched = shows.filter(s=>(s.episodesWatched||0)>0).sort((a,b)=>(b.episodesWatched||0)-(a.episodesWatched||0)).slice(0,5);
  const statCards = [
    { label:'Total Shows', value:shows.length, icon:'📺' },
    { label:'Watching', value:shows.filter(s=>s.status==='Watching').length, icon:'▶' },
    { label:'Paused', value:shows.filter(s=>s.status==='Paused').length, icon:'⏸' },
    { label:'Completed', value:shows.filter(s=>s.status==='Watched').length, icon:'✅' },
    { label:'Eps Watched', value:totalEps, icon:'🎬' },
  ].map(s => `<div style="background:#1a1a2e;border:1px solid #252540;border-radius:10px;padding:16px;text-align:center;"><div style="font-size:22px;margin-bottom:4px;">${s.icon}</div><div style="font-family:'Playfair Display',serif;font-size:24px;color:#e94560;margin-bottom:4px;">${s.value}</div><div style="font-size:11px;color:#6060a0;">${s.label}</div></div>`).join('');
  const statusRows = Object.entries(STATUS_META).map(([status,sm]) => {
    const count = shows.filter(s=>s.status===status).length;
    const pct = shows.length ? Math.round((count/shows.length)*100) : 0;
    return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #25254020;">
      ${badge(`${sm.icon} ${status}`,sm.color,sm.bright)}
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%;background:${sm.bright};"></div></div>
      <span style="font-family:'Playfair Display',serif;font-size:15px;min-width:20px;text-align:right;">${count}</span>
    </div>`;
  }).join('');
  const topRows = topWatched.length===0
    ? `<div style="color:#6060a0;font-size:13px;text-align:center;padding-top:20px;">Mark episodes as watched to see rankings</div>`
    : topWatched.map((s,i) => `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #25254020;">
        <span style="font-size:${i===0?18:13}px;width:22px;text-align:center;">${i===0?'🏆':i+1}</span>
        ${coverHTML(s,20)}
        <div style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.title}</div>
        <span style="color:#e94560;font-size:13px;font-weight:700;white-space:nowrap;">${s.episodesWatched} eps</span>
      </div>`).join('');
  return `
    <h2 style="font-family:'Playfair Display',serif;font-size:26px;margin-bottom:20px;">Stats</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;">${statCards}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div style="background:#1a1a2e;border:1px solid #252540;border-radius:10px;padding:18px;">
        <h3 style="font-family:'Playfair Display',serif;font-size:16px;margin-bottom:14px;">By Status</h3>${statusRows}
      </div>
      <div style="background:#1a1a2e;border:1px solid #252540;border-radius:10px;padding:18px;">
        <h3 style="font-family:'Playfair Display',serif;font-size:16px;margin-bottom:14px;">🏆 Most Watched</h3>${topRows}
      </div>
    </div>`;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
state.apiKey = localStorage.getItem('showly_api_key') || '';
state.detailSearchResults = [];
state.activeSeason = 1;

sb.auth.getSession().then(({ data: { session } }) => {
  if (session) { state.user = session.user; state.session = session; loadShows().then(render); }
  else render();
});

sb.auth.onAuthStateChange((_event, session) => {
  state.user = session?.user || null;
  state.session = session;
  state.shows = [];
  state.loaded = false;
  if (state.user) loadShows().then(render);
  else render();
});
</script>
</body>
</html>
