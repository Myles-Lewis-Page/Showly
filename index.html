<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Showly</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d14; color: #e8e8f0; font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  input, select, button { font-family: 'DM Sans', sans-serif; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0d0d14; } ::-webkit-scrollbar-thumb { background: #252540; border-radius: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .fade { animation: fadeIn 0.3s ease; }
  .card { background: #1a1a2e; border: 1px solid #252540; border-radius: 12px; transition: border-color 0.2s, transform 0.2s; }
  .card:hover { border-color: rgba(233,69,96,0.4); transform: translateY(-1px); }
  .btn { border: none; cursor: pointer; font-weight: 600; border-radius: 6px; padding: 8px 18px; font-size: 13px; transition: opacity 0.15s; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-accent { background: #e94560; color: #fff; }
  .btn-blue { background: #0f3460; color: #fff; }
  .btn-ghost { background: none; border: 1px solid #252540; color: #6060a0; }
  .btn-purple { background: #3d1f5e; border: 1px solid rgba(155,89,182,0.4); color: #c39bd3; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.15s ease; }
  .modal { background: #13131f; border: 1px solid #252540; border-radius: 12px; padding: 24px; width: 380px; max-width: 92vw; box-shadow: 0 20px 60px rgba(0,0,0,0.6); max-height: 88vh; overflow-y: auto; }
  .tab-bar { background: #13131f; border-bottom: 1px solid #252540; position: sticky; top: 0; z-index: 100; }
  .tab-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; overflow-x: auto; }
  .tab-btn { background: none; border: none; cursor: pointer; color: #6060a0; border-bottom: 2px solid transparent; padding: 14px 13px; font-size: 12.5px; font-weight: 400; white-space: nowrap; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
  .tab-btn.active { color: #e8e8f0; border-bottom-color: #e94560; font-weight: 600; }
  .tab-badge { border-radius: 10px; font-size: 10px; font-weight: 700; padding: 1px 6px; min-width: 18px; text-align: center; }
  .content { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
  .ep-banner { padding: 10px 18px; border-bottom: 1px solid #252540; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .progress-bar { height: 3px; background: #252540; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .badge { border-radius: 4px; padding: 1px 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; white-space: nowrap; }
  .platform-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .platform-btn { padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 400; text-align: left; transition: all 0.15s; background: #1a1a2e; border: 1px solid #252540; color: #6060a0; }
  .platform-btn.selected { background: #0f3460; border-color: #1a5296; color: #fff; font-weight: 600; }
  .ep-row { display: grid; grid-template-columns: 36px 50px 1fr; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid rgba(37,37,64,0.15); cursor: default; transition: background 0.15s; }
  .ep-row:hover { background: rgba(37,37,64,0.2); }
  .ep-row.watched { background: rgba(26,46,26,0.12); }
  .ep-row.watched:hover { background: rgba(26,46,26,0.25); }
  .check-btn { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; transition: all 0.2s; border: 2px solid #252540; background: transparent; color: #6060a0; }
  .check-btn.watched { border-color: #2ecc71; background: rgba(46,204,113,0.15); color: #2ecc71; }
  .cover { border-radius: 6px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden; position: relative; }
  .spinner { animation: spin 1s linear infinite; display: inline-block; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const SUPABASE_URL = 'https://jtnkwzzaubkvqszjrrak.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0bmt3enphdWJrdnFzempycmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMzgxMjYsImV4cCI6MjA4ODgxNDEyNn0.UhKOw3DulX38GvYErlAo0gejoFtWfn1_bpHRPOrw8-4';
const ANTHROPIC_KEY = prompt("Enter your Anthropic API key (sk-ant-...):") || "";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const C = {
  bg:"#0d0d14", surface:"#13131f", card:"#1a1a2e", border:"#252540",
  accent:"#e94560", blue:"#0f3460", blueBright:"#1a5296",
  text:"#e8e8f0", muted:"#6060a0", green:"#2ecc71", amber:"#f39c12",
  purple:"#9b59b6", purpleDim:"#3d1f5e",
};

const STATUS_META = {
  Watching:  { color:"#0f3460", bright:"#4a9eff", icon:"▶" },
  Watched:   { color:"#1a3d2b", bright:"#2ecc71", icon:"✓" },

};

const COVER_PALETTES = [
  ["#e94560","#0f3460"],["#9b59b6","#1a0a2e"],["#2ecc71","#0a2e1a"],
  ["#f39c12","#2e1a00"],["#4a9eff","#0a1a2e"],["#e67e22","#2e0f00"],
  ["#1abc9c","#002e28"],["#e91e8c","#2e0020"],
];

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31,h) + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

// ── State ────────────────────────────────────────────────────────────────────
let state = {
  tab: "watching",
  shows: [],
  user: null,
  authMode: "login",
  authEmail: "", authPassword: "", authError: "", authLoading: false,
  adding: { watching: false, watchlist: false, shows: false },
  addTitle: "",
  addLoading: false,
  addError: "",
  addStep: "name", // name | disambig | platform
  addMatches: [],
  addPending: null,
  addDefaultStatus: "Watching",
  filter: "All",
  detailShowId: "",
  detailQuery: "",
  detailSearching: false,
  detailResults: [],
  detailActiveSeason: 1,
  detailLoadingEps: false,
  detailEpError: "",
  pauseModalShow: null,
  platformModalShow: null,
  platformModalTitle: "Start Watching",
  platformModalCallback: null,
  platformSelected: "",
  platformCustom: "",
  resumeModalShow: null,
  disambigMatches: [],
  disambigCallback: null,
};

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

// ── Supabase ─────────────────────────────────────────────────────────────────
async function loadShows() {
  if (!state.user) return;
  const { data, error } = await sb.from("shows").select("id, data").eq("user_id", state.user.id);
  if (!error && data) {
    setState({ shows: data.map(r => r.data) });
  }
}

async function saveShow(show) {
  if (!state.user) return;
  await sb.from("shows").upsert({ id: show.id, user_id: state.user.id, data: show, updated_at: new Date().toISOString() });
}

async function deleteShow(id) {
  if (!state.user) return;
  await sb.from("shows").delete().eq("id", id).eq("user_id", state.user.id);
}

function upsertShow(show) {
  const shows = state.shows;
  const idx = shows.findIndex(s => s.id === show.id);
  const next = idx >= 0 ? [...shows.slice(0,idx), show, ...shows.slice(idx+1)] : [...shows, show];
  setState({ shows: next });
  saveShow(show);
}

function removeShow(id) {
  setState({ shows: state.shows.filter(s => s.id !== id) });
  deleteShow(id);
}

// ── Claude ───────────────────────────────────────────────────────────────────
async function askClaude(prompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-api-key": ANTHROPIC_KEY, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 4000, messages: [{ role: "user", content: prompt }] }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const text = data.content?.map(b => b.text || "").join("") || "";
  return text.replace(/^```json\s*/i,"").replace(/^```\s*/i,"").replace(/```\s*$/,"").trim();
}

function parseJSON(raw) {
  try { return JSON.parse(raw); } catch {
    const m = raw.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
    if (m) try { return JSON.parse(m[1]); } catch {}
    return null;
  }
}

async function loadEpisodesForShow(show) {
  const raw = await askClaude(
    `List every season and episode of the TV show "${show.title}"${show.years ? ` (${show.years})` : ""}. ` +
    `Return ONLY valid JSON, no markdown, no explanation. Use this exact format: ` +
    `{"seasons":[{"number":1,"episodes":[{"number":1,"title":"Pilot","runtime":47},{"number":2,"title":"Cat's in the Bag","runtime":48}]},{"number":2,"episodes":[{"number":1,"title":"Seven Thirty-Seven","runtime":47}]}]}`
  );
  const data = parseJSON(raw);
  if (!data?.seasons) throw new Error("Bad response");
  return { episodeData: data.seasons, totalEpisodes: data.seasons.reduce((a,s) => a + s.episodes.length, 0) };
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function getNextEpisode(show) {
  if (!show.episodeData) return null;
  for (const season of show.episodeData) {
    for (let i = 0; i < season.episodes.length; i++) {
      const key = `${season.number}-${i+1}`;
      if (!show.watchedEps?.[key]) return { season: season.number, episode: i+1, title: season.episodes[i].title, runtime: season.episodes[i].runtime };
    }
  }
  return null;
}

function getPausedAt(show) {
  if (show.pauseEpisode) return show.pauseEpisode;
  if (!show.episodeData) return null;
  let last = null;
  for (const season of show.episodeData) {
    for (let i = 0; i < season.episodes.length; i++) {
      const key = `${season.number}-${i+1}`;
      if (show.watchedEps?.[key]) last = { season: season.number, episode: i+1, title: season.episodes[i].title };
    }
  }
  return last;
}

function pad(n) { return String(n).padStart(2,"0"); }

// ── Cover Art ─────────────────────────────────────────────────────────────────
function coverHTML(show, size) {
  const [a,b] = COVER_PALETTES[hashStr(show.title) % COVER_PALETTES.length];
  const words = show.title.trim().split(/\s+/);
  const initials = words.length === 1 ? words[0].slice(0,2).toUpperCase() : words.slice(0,2).map(w=>w[0].toUpperCase()).join("");
  const fs = size * 0.28;
  const h = size * 1.5;
  return `<div class="cover" style="width:${size}px;height:${h}px;background:linear-gradient(145deg,${a},${b});">
    <span style="font-size:${fs*1.3}px;font-weight:900;color:#fff;letter-spacing:1px;font-family:'Playfair Display',serif;text-shadow:0 2px 8px #0008;z-index:1">${initials}</span>
    <span style="font-size:${fs*0.6}px;color:rgba(255,255,255,0.7);font-weight:600;z-index:1;text-align:center;padding:0 ${size*0.08}px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${show.title}</span>
    ${show.years ? `<span style="font-size:${fs*0.5}px;color:rgba(255,255,255,0.45);z-index:1">${show.years}</span>` : ""}
  </div>`;
}

// ── HTML Builders ─────────────────────────────────────────────────────────────
function progressHTML(watched, total) {
  if (!total) return "";
  const pct = Math.min(100, Math.round((watched/total)*100));
  const color = pct===100 ? C.green : C.accent;
  return `<div style="display:flex;align-items:center;gap:8px;">
    <div class="progress-bar" style="flex:1"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
    <span style="font-size:11px;color:${C.muted};min-width:32px;text-align:right">${pct}%</span>
  </div>`;
}

function badgeHTML(label, color, bright) {
  return `<span class="badge" style="background:${color};color:${bright};border:1px solid ${bright}50">${label}</span>`;
}

function spinnerHTML(text="Loading…") {
  return `<span style="display:flex;align-items:center;gap:8px;color:${C.muted};font-size:12px"><span class="spinner">⟳</span>${text}</span>`;
}

// ── Auth Screen ───────────────────────────────────────────────────────────────
function renderAuth() {
  const { authMode, authEmail, authPassword, authError, authLoading } = state;
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
    <div style="width:380px;max-width:100%">
      <h1 style="font-family:'Playfair Display',serif;font-size:36px;color:${C.accent};letter-spacing:2px;text-align:center;margin-bottom:8px">SHOWLY</h1>
      <p style="text-align:center;color:${C.muted};font-size:13px;margin-bottom:32px">Track every show. Never lose your place.</p>
      <div style="background:${C.surface};border:1px solid ${C.border};border-radius:12px;padding:28px">
        <div style="display:flex;gap:0;margin-bottom:24px;border:1px solid ${C.border};border-radius:8px;overflow:hidden">
          <button onclick="setState({authMode:'login'})" style="flex:1;padding:9px;background:${authMode==='login'?C.accent:'transparent'};color:${authMode==='login'?'#fff':C.muted};border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s">Log In</button>
          <button onclick="setState({authMode:'signup'})" style="flex:1;padding:9px;background:${authMode==='signup'?C.accent:'transparent'};color:${authMode==='signup'?'#fff':C.muted};border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s">Sign Up</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px">
          <input id="auth-email" type="email" placeholder="Email" value="${authEmail}"
            oninput="setState({authEmail:this.value})"
            onkeydown="if(event.key==='Enter')handleAuth()"
            style="background:${C.bg};border:1px solid ${C.border};color:${C.text};padding:10px 14px;border-radius:7px;font-size:13px;outline:none;width:100%" />
          <input id="auth-password" type="password" placeholder="Password" value="${authPassword}"
            oninput="setState({authPassword:this.value})"
            onkeydown="if(event.key==='Enter')handleAuth()"
            style="background:${C.bg};border:1px solid ${C.border};color:${C.text};padding:10px 14px;border-radius:7px;font-size:13px;outline:none;width:100%" />
          ${authError ? `<div style="color:${C.accent};font-size:12px;text-align:center">${authError}</div>` : ""}
          <button class="btn btn-accent" onclick="handleAuth()" ${authLoading?"disabled":""} style="width:100%;padding:11px;font-size:14px">
            ${authLoading ? spinnerHTML(authMode==='login'?'Logging in…':'Creating account…') : (authMode==='login'?'Log In':'Create Account')}
          </button>
        </div>
      </div>
    </div>
  </div>`;
}

async function handleAuth() {
  const { authMode, authEmail, authPassword } = state;
  if (!authEmail || !authPassword) return setState({ authError: "Please fill in all fields." });
  setState({ authLoading: true, authError: "" });
  try {
    let result;
    if (authMode === "login") {
      result = await sb.auth.signInWithPassword({ email: authEmail, password: authPassword });
    } else {
      result = await sb.auth.signUp({ email: authEmail, password: authPassword });
    }
    if (result.error) setState({ authError: result.error.message, authLoading: false });
    else { setState({ authLoading: false }); }
  } catch(e) { setState({ authError: e.message, authLoading: false }); }
}

// ── Add Show ──────────────────────────────────────────────────────────────────
function renderAddFlow(tabKey) {
  const { addStep, addTitle, addLoading, addError, addMatches, addPending } = state;

  if (addStep === "disambig") {
    return `<div class="modal-overlay" onclick="cancelAdd()">
      <div class="modal" onclick="event.stopPropagation()">
        <h3 style="font-family:'Playfair Display',serif;font-size:18px;margin-bottom:6px">Multiple Matches Found</h3>
        <p style="color:${C.muted};font-size:13px;margin-bottom:18px">Which show did you mean?</p>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${addMatches.map((m,i) => `
            <div onclick="selectMatch(${i})" class="card" style="padding:12px 16px;cursor:pointer;display:flex;gap:12px;align-items:center">
              ${coverHTML(m, 36)}
              <div style="flex:1">
                <div style="font-family:'Playfair Display',serif;font-size:15px;margin-bottom:3px">${m.title}</div>
                <div style="font-size:12px;color:${C.muted}">${[m.years,m.genre,m.network].filter(Boolean).join(" · ")}</div>
                ${m.description ? `<div style="font-size:11px;color:${C.muted};font-style:italic;margin-top:3px">${m.description}</div>` : ""}
              </div>
              <span style="color:${C.accent};font-size:18px">→</span>
            </div>`).join("")}
        </div>
        <button class="btn btn-ghost" onclick="cancelAdd()" style="width:100%;margin-top:14px">Cancel</button>
      </div>
    </div>`;
  }

  return `<div style="background:${C.card};border:1px solid ${C.border};border-radius:10px;padding:16px;margin-bottom:20px">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input id="add-title-input" placeholder="Show title…" value="${addTitle}" autofocus
        oninput="setState({addTitle:this.value})"
        onkeydown="if(event.key==='Enter')submitAddName()"
        style="flex:1;min-width:180px;background:${C.surface};border:1px solid ${C.border};color:${C.text};padding:9px 12px;border-radius:6px;font-size:13px;outline:none" />
      <button class="btn btn-accent" onclick="submitAddName()" ${addLoading||!addTitle.trim()?"disabled":""}>
        ${addLoading ? spinnerHTML("Searching…") : "Next →"}
      </button>
      <button class="btn btn-ghost" onclick="cancelAdd()">✕</button>
    </div>
    ${addError ? `<div style="color:${C.accent};font-size:12px;margin-top:8px">${addError}</div>` : ""}
  </div>`;
}

async function submitAddName() {
  const title = state.addTitle.trim();
  if (!title) return;
  setState({ addLoading: true, addError: "" });
  try {
    const raw = await askClaude(
      `Are there multiple distinct TV shows named "${title}" (e.g. remakes, reboots, different countries or eras)? ` +
      `Return ONLY a valid JSON array, no markdown, no explanation: [{"title":"...","years":"...","genre":"...","network":"...","description":"one sentence"}]. ` +
      `If only one show matches return one item. Include 2-5 only if genuinely different shows share the name.`
    );
    const results = parseJSON(raw);
    if (!results?.length) throw new Error("No results");
    if (results.length > 1) {
      setState({ addLoading: false, addStep: "disambig", addMatches: results });
    } else {
      setState({ addLoading: false, addPending: results[0] });
      if (state.addDefaultStatus === "Watching") openPlatformForAdd(results[0]);
      else finalizeAdd(results[0], "");
    }
  } catch(e) {
    setState({ addLoading: false, addError: "Couldn't find that show. Try a different title." });
  }
}

function selectMatch(i) {
  const match = state.addMatches[i];
  setState({ addStep: "name", addMatches: [], addPending: match });
  if (state.addDefaultStatus === "Watching") openPlatformForAdd(match);
  else finalizeAdd(match, "");
}

function openPlatformForAdd(meta) {
  setState({
    platformModalShow: meta,
    platformModalTitle: "Start Watching",
    platformSelected: "",
    platformCustom: "",
    platformModalCallback: (platform) => { finalizeAdd(meta, platform); },
  });
}

function finalizeAdd(meta, platform) {
  const show = {
    id: Date.now().toString(),
    title: meta.title || state.addTitle.trim(),
    genre: meta.genre || "", network: meta.network || "",
    years: meta.years || "", description: meta.description || "",
    status: state.addDefaultStatus, watchingOn: platform || "",
    totalEpisodes: "", episodesWatched: 0,
    episodeData: null, watchedEps: {}, pauseNote: "", pauseEpisode: null,
  };
  upsertShow(show);
  cancelAdd();
}

function cancelAdd() {
  setState({ addStep: "name", addTitle: "", addLoading: false, addError: "", addMatches: [], addPending: null, platformModalShow: null, adding: { watching: false, watchlist: false, shows: false } });
}

// ── Platform Modal ────────────────────────────────────────────────────────────
function renderPlatformModal() {
  const { platformModalShow, platformModalTitle, platformSelected, platformCustom, platformModalCallback } = state;
  if (!platformModalShow) return "";
  return `<div class="modal-overlay" onclick="closePlatformModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3 style="font-family:'Playfair Display',serif;font-size:18px;margin-bottom:6px">${platformModalTitle}</h3>
      <p style="color:${C.muted};font-size:13px;margin-bottom:18px">Where are you watching <strong style="color:${C.text}">${platformModalShow.title}</strong>?</p>
      <div class="platform-grid">
        ${PLATFORMS.map(p => `<button class="platform-btn ${platformSelected===p?'selected':''}" onclick="setState({platformSelected:'${p}'})">${p}</button>`).join("")}
      </div>
      ${platformSelected==="Other" ? `<input placeholder="Platform name…" value="${platformCustom}" oninput="setState({platformCustom:this.value})" onkeydown="if(event.key==='Enter')confirmPlatform()" style="width:100%;background:${C.bg};border:1px solid ${C.border};color:${C.text};padding:9px 12px;border-radius:7px;font-size:13px;outline:none;margin-bottom:14px" />` : ""}

      </div>
    </div>
  </div>`;
}

function confirmPlatform() {
  const { platformSelected, platformCustom, platformModalCallback } = state;
  const platform = platformSelected === "Other" ? (platformCustom.trim() || "Other") : platformSelected;
  if (platformModalCallback) platformModalCallback(platform);
  setState({ platformModalShow: null, platformModalCallback: null });
}

function closePlatformModal() {
  setState({ platformModalShow: null, platformModalCallback: null });
  if (state.addStep === "platform") cancelAdd();
}

// ── Pause Modal ───────────────────────────────────────────────────────────────
function renderPauseModal() {
  const { pauseModalShow } = state;
  if (!pauseModalShow) return "";
  const next = getNextEpisode(pauseModalShow);
  const ph = next ? `e.g. S${pad(next.season)}E${pad(next.episode)} — ${next.title}` : "e.g. Season 2, Episode 4…";
  return `<div class="modal-overlay" onclick="setState({pauseModalShow:null})">
    <div class="modal" onclick="event.stopPropagation()">
      <h3 style="font-family:'Playfair Display',serif;font-size:18px;margin-bottom:6px">Pause Show</h3>
      <p style="color:${C.muted};font-size:13px;margin-bottom:18px">Pausing <strong style="color:${C.text}">${pauseModalShow.title}</strong>. Add a note to remember where you left off.</p>
      <input id="pause-note" placeholder="${ph}" autofocus
        onkeydown="if(event.key==='Enter')confirmPause()"
        style="width:100%;background:${C.bg};border:1px solid ${C.border};color:${C.text};padding:10px 12px;border-radius:7px;font-size:13px;outline:none;margin-bottom:16px" />
      <div style="display:flex;gap:8px">
        <button class="btn btn-purple" onclick="confirmPause()" style="flex:1;padding:10px;font-size:14px">⏸ Pause</button>
        <button class="btn btn-ghost" onclick="setState({pauseModalShow:null})" style="padding:10px 16px">Cancel</button>
      </div>
    </div>
  </div>`;
}

function confirmPause() {
  const show = state.pauseModalShow;
  const note = document.getElementById("pause-note")?.value?.trim() || "";
  const next = getNextEpisode(show);
  const pauseEp = next ? { season: next.season, episode: next.episode, title: next.title } : null;
  upsertShow({ ...show, status: "Paused", pauseNote: note, pauseEpisode: pauseEp });
  setState({ pauseModalShow: null });
}

    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:10px">
      <div>
        <h2 style="font-family:'Playfair Display',serif;font-size:28px;margin-bottom:4px">Currently Watching</h2>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:8px;height:8px;border-radius:50%;background:${C.accent};animation:pulse 1.5s ease-in-out infinite"></div>
          <span style="color:${C.muted};font-size:13px">${watching.length} active ${watching.length===1?"show":"shows"}</span>
        </div>
      </div>
      <button class="btn btn-accent" onclick="setState({adding:{...state.adding,watching:true},addDefaultStatus:'Watching'})">+ Add Show</button>

        <div style="font-size:14px;margin-bottom:24px">Start a show from your watchlist</div>
        <button class="btn btn-accent" onclick="setState({tab:'watchlist'})">Browse Watchlist</button>
      </div>` :
      `<div style="display:grid;gap:14px">${watching.map(s => watchingCardHTML(s)).join("")}</div>`
    }
  </div>`;
}

function watchingCardHTML(show) {
  const next = getNextEpisode(show);
  let banner = "";
  if (!show.episodeData) {
    banner = `<div class="ep-banner" style="background:rgba(15,52,96,0.4);justify-content:space-between">
      <span style="color:${C.muted};font-size:12px;font-style:italic">Load episodes to track progress</span>
      <button class="btn btn-accent" onclick="doLoadEpisodes('${show.id}')" style="padding:5px 14px;font-size:11px">⬇ Load Episodes</button>
    </div>`;
  } else if (next) {
    banner = `<div class="ep-banner" style="background:linear-gradient(135deg,rgba(15,52,96,0.8),rgba(233,69,96,0.2))">
      <div style="flex:1">
        <div style="font-size:10px;font-weight:800;letter-spacing:1.5px;color:#4a9eff;text-transform:uppercase;margin-bottom:2px">Up Next</div>
        <div style="color:${C.text};font-size:14px;font-weight:600">S${pad(next.season)}E${pad(next.episode)} — ${next.title}${next.runtime?`<span style="color:${C.muted};font-size:11px;font-weight:400;margin-left:8px">${next.runtime}m</span>`:""}</div>
      </div>
      <button class="btn" onclick="markWatched('${show.id}')" style="background:${C.green};color:#fff;padding:7px 18px;font-size:12px;flex-shrink:0">✓ Watched</button>
    </div>`;
  } else {
    banner = `<div class="ep-banner" style="background:linear-gradient(135deg,rgba(26,61,43,0.6),rgba(46,204,113,0.2))">
      <span style="font-size:10px;font-weight:800;letter-spacing:1.5px;color:${C.green};text-transform:uppercase">✓ All Caught Up</span>
    </div>`;
  }
  return `<div class="card" style="overflow:hidden">
    ${banner}
    <div style="padding:14px 18px;display:flex;gap:14px;align-items:flex-start">
      ${coverHTML(show, 64)}
      <div style="flex:1;display:flex;flex-direction:column;gap:5px;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-family:'Playfair Display',serif;font-size:17px;font-weight:700;cursor:pointer" onclick="viewDetail('${show.id}')">${show.title}</span>
          ${show.years?`<span style="color:${C.muted};font-size:11px">${show.years}</span>`:""}
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:${C.muted}">
          ${show.watchingOn?`<span style="color:#4a9eff">📡 ${show.watchingOn}</span>`:""}
          ${show.genre?`<span>🎭 ${show.genre}</span>`:""}
          ${show.totalEpisodes?`<span>🎬 ${show.episodesWatched||0}/${show.totalEpisodes} eps</span>`:""}

      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0">
        <button class="btn btn-purple" onclick="openPause('${show.id}')" style="padding:6px 14px;font-size:12px">⏸ Pause</button>
        <button class="btn btn-ghost" onclick="removeShow('${show.id}')" style="padding:4px 8px;font-size:10px">Remove</button>
      </div>
    </div>
  </div>`;
}

function markWatched(id) {
  const show = state.shows.find(s => s.id === id);
  if (!show) return;
  const next = getNextEpisode(show);
  if (!next) return;
  const key = `${next.season}-${next.episode}`;
  const watchedEps = { ...show.watchedEps, [key]: true };
  upsertShow({ ...show, watchedEps, episodesWatched: Object.values(watchedEps).filter(Boolean).length });
}

async function doLoadEpisodes(id) {
  const show = state.shows.find(s => s.id === id);
  if (!show) return;
  // Show loading state inline
  const shows = state.shows.map(s => s.id === id ? { ...s, _loadingEps: true } : s);
  setState({ shows });
  try {
    const updates = await loadEpisodesForShow(show);
    upsertShow({ ...show, ...updates, _loadingEps: false });
  } catch {
    upsertShow({ ...show, _loadingEps: false });
    alert("Failed to load episodes. Try again.");
  }
}

function openPause(id) {
  const show = state.shows.find(s => s.id === id);
  setState({ pauseModalShow: show });
}

}

}

        ${Object.keys(STATUS_META).map(s=>`<option ${show.status===s?"selected":""}>${s}</option>`).join("")}

      <button class="btn btn-ghost" onclick="removeShow('${show.id}')" style="padding:3px 8px;font-size:10px">Remove</button>

function changeStatus(id, newStatus) {
  const show = state.shows.find(s => s.id === id);
  if (!show) return;
  if (newStatus === "Watching") {
    setState({
      platformModalShow: show,
      platformModalTitle: "Start Watching",
      platformSelected: show.watchingOn || "",
      platformCustom: "",
      platformModalCallback: (platform) => upsertShow({ ...show, status: "Watching", watchingOn: platform }),

  } else {
    upsertShow({ ...show, status: newStatus });
  }
}

              <div style="display:flex;gap:10px;align-items:center">
                <span style="font-size:12px;color:${C.muted}">${seasonData.episodes.filter((_,i)=>selected.watchedEps?.[`${seasonData.number}-${i+1}`]).length}/${seasonData.episodes.length}</span>
                <button onclick="toggleAllEps()" style="background:${C.surface};border:1px solid ${C.border};color:${C.muted};padding:4px 10px;border-radius:5px;cursor:pointer;font-size:11px">Toggle All</button>
              </div>
            </div>
            ${seasonData.episodes.map((ep,i) => {
              const epNum = i+1;
              const key = `${seasonData.number}-${epNum}`;
              const watched = !!selected.watchedEps?.[key];
              return `<div class="ep-row ${watched?'watched':''}">
                <button class="check-btn ${watched?'watched':''}" onclick="toggleEp('${selected.id}','${seasonData.number}','${epNum}')">${watched?"✓":"○"}</button>
                <span style="font-size:11px;color:${C.muted};font-weight:600">E${pad(epNum)}</span>
                <div>
                  <div style="font-size:13px;color:${watched?C.muted:C.text};font-weight:500">${ep.title}</div>
                  ${ep.runtime?`<div style="font-size:11px;color:${C.muted}">${ep.runtime} min</div>`:""}
                </div>
              </div>`;
            }).join("")}
          </div>` : ""}
      ` : ""}
    ` : `
      <div style="text-align:center;padding:60px 0;color:${C.muted}">
        <div style="font-size:48px;margin-bottom:12px">🔍</div>
        <div style="font-size:15px">Select a show or search for any title</div>
      </div>`}
  </div>`;
}

async function detailSearch() {
  const q = state.detailQuery.trim();
  if (!q) return;
  setState({ detailSearching: true });
  try {
    const raw = await askClaude(`List 5 TV shows matching "${q}". Return ONLY a valid JSON array, no markdown: [{"title":"...","years":"...","genre":"...","network":"...","description":"one sentence"}]`);
    setState({ detailSearching: false, detailResults: parseJSON(raw) || [] });
  } catch { setState({ detailSearching: false, detailResults: [] }); }
}

function detailAddAndView(i) {
  const r = state.detailResults[i];
  const existing = state.shows.find(s => s.title.toLowerCase()===r.title.toLowerCase() && s.years===r.years);
  if (existing) { setState({ detailShowId: existing.id, detailResults: [] }); return; }
  const show = { id: Date.now().toString(), title: r.title, genre: r.genre||"", network: r.network||"", years: r.years||"", description: r.description||"", status: "Watchlist", totalEpisodes: "", episodesWatched: 0, episodeData: null, watchedEps: {}, pauseNote: "", pauseEpisode: null, watchingOn: "" };
  upsertShow(show);
  setState({ detailShowId: show.id, detailResults: [] });
  detailLoadEpsFor(show);
}

async function detailLoadEps() {
  const show = state.shows.find(s => s.id === state.detailShowId);
  if (!show) return;
  await detailLoadEpsFor(show);
}

async function detailLoadEpsFor(show) {
  setState({ detailLoadingEps: true, detailEpError: "" });
  try {
    const updates = await loadEpisodesForShow(show);
    upsertShow({ ...show, ...updates });
    setState({ detailLoadingEps: false, detailActiveSeason: 1 });
  } catch { setState({ detailLoadingEps: false, detailEpError: "Failed to load. Try again." }); }
}

function toggleEp(showId, sn, en) {
  const show = state.shows.find(s => s.id === showId);
  if (!show) return;
  const key = `${sn}-${en}`;
  const watchedEps = { ...show.watchedEps, [key]: !show.watchedEps?.[key] };
  upsertShow({ ...show, watchedEps, episodesWatched: Object.values(watchedEps).filter(Boolean).length });
}

function toggleAllEps() {
  const show = state.shows.find(s => s.id === state.detailShowId);
  if (!show) return;
  const seasonData = show.episodeData?.find(s => s.number === state.detailActiveSeason);
  if (!seasonData) return;
  const nw = { ...show.watchedEps };
  const allW = seasonData.episodes.every((_,i) => show.watchedEps?.[`${seasonData.number}-${i+1}`]);
  seasonData.episodes.forEach((_,i) => { nw[`${seasonData.number}-${i+1}`] = !allW; });
  upsertShow({ ...show, watchedEps: nw, episodesWatched: Object.values(nw).filter(Boolean).length });
}

function viewDetail(id) { setState({ tab: "detail", detailShowId: id }); }

// ── Watchlist Tab ─────────────────────────────────────────────────────────────
function renderWatchlist() {
  const { shows, adding } = state;
  const watchlist = shows.filter(s => s.status === "Watchlist");
  return `<div class="fade">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 style="font-family:'Playfair Display',serif;font-size:26px">Watchlist <span style="color:${C.muted};font-size:16px">(${watchlist.length})</span></h2>
      <button class="btn ${adding.watchlist?'btn-ghost':'btn-accent'}" onclick="setState({adding:{...state.adding,watchlist:!state.adding.watchlist},addDefaultStatus:'Watchlist'})">${adding.watchlist?"✕ Cancel":"+ Add"}</button>
    </div>
    ${adding.watchlist ? renderAddFlow("watchlist") : ""}
    ${watchlist.length===0&&!adding.watchlist ? `<div style="text-align:center;padding:60px 0;color:${C.muted}"><div style="font-size:48px;margin-bottom:12px">🔖</div><div>Your watchlist is empty</div></div>` :
      `<div style="display:grid;gap:10px">${watchlist.map(show=>`
        <div class="card" style="padding:14px 18px;display:flex;gap:14px;align-items:center">
          ${coverHTML(show, 56)}
          <div style="flex:1">
            <div style="display:flex;gap:10px;align-items:center;margin-bottom:4px;flex-wrap:wrap">
              <span style="font-family:'Playfair Display',serif;font-size:16px;font-weight:700">${show.title}</span>
              ${show.years?`<span style="color:${C.muted};font-size:11px">${show.years}</span>`:""}
            </div>
            <div style="font-size:12px;color:${C.muted};display:flex;gap:12px;flex-wrap:wrap">
              ${show.network?`<span>📡 ${show.network}</span>`:""}
              ${show.genre?`<span>🎭 ${show.genre}</span>`:""}
            </div>
            ${show.description?`<div style="font-size:11px;color:${C.muted};font-style:italic;margin-top:4px;max-width:500px">${show.description}</div>`:""}
          </div>
          <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
            <button class="btn btn-blue" onclick="startFromWatchlist('${show.id}')" style="padding:6px 12px;font-size:12px">▶ Start</button>
            <button class="btn btn-ghost" onclick="removeShow('${show.id}')" style="padding:6px 10px;font-size:11px">✕</button>
          </div>
        </div>`).join("")}
      </div>`}
  </div>`;
}

function startFromWatchlist(id) {
  const show = state.shows.find(s => s.id === id);
  if (!show) return;
  setState({
    platformModalShow: show,
    platformModalTitle: "Start Watching",
    platformSelected: "",
    platformCustom: "",
    platformModalCallback: (platform) => upsertShow({ ...show, status: "Watching", watchingOn: platform }),
  });
}

// ── Stats Tab ─────────────────────────────────────────────────────────────────
function renderStats() {
  const { shows } = state;
  const totalEps = shows.reduce((a,s)=>a+(s.episodesWatched||0),0);
  const topWatched = shows.filter(s=>(s.episodesWatched||0)>0).sort((a,b)=>(b.episodesWatched||0)-(a.episodesWatched||0)).slice(0,5);
  const statCards = [
    { label:"Total Shows", value:shows.length, icon:"📺" },
    { label:"Watching", value:shows.filter(s=>s.status==="Watching").length, icon:"▶" },
    { label:"Paused", value:shows.filter(s=>s.status==="Paused").length, icon:"⏸" },
    { label:"Completed", value:shows.filter(s=>s.status==="Watched").length, icon:"✅" },
    { label:"Eps Watched", value:totalEps, icon:"🎬" },
  ];
  return `<div class="fade">
    <h2 style="font-family:'Playfair Display',serif;font-size:26px;margin-bottom:20px">Stats</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px">
      ${statCards.map(s=>`
        <div style="background:${C.card};border:1px solid ${C.border};border-radius:10px;padding:16px;text-align:center">
          <div style="font-size:22px;margin-bottom:4px">${s.icon}</div>
          <div style="font-family:'Playfair Display',serif;font-size:24px;color:${C.accent};margin-bottom:4px">${s.value}</div>
          <div style="font-size:11px;color:${C.muted}">${s.label}</div>
        </div>`).join("")}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div style="background:${C.card};border:1px solid ${C.border};border-radius:10px;padding:18px">
        <h3 style="font-family:'Playfair Display',serif;font-size:16px;margin-bottom:14px">By Status</h3>
        ${Object.entries(STATUS_META).map(([status,sm])=>{
          const count = shows.filter(s=>s.status===status).length;
          const pct = shows.length ? Math.round((count/shows.length)*100) : 0;
          return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(37,37,64,0.2)">
            ${badgeHTML(`${sm.icon} ${status}`, sm.color, sm.bright)}
            <div class="progress-bar" style="flex:1"><div class="progress-fill" style="width:${pct}%;background:${sm.bright}"></div></div>
            <span style="font-family:'Playfair Display',serif;font-size:15px;min-width:20px;text-align:right">${count}</span>
          </div>`;
        }).join("")}
      </div>
      <div style="background:${C.card};border:1px solid ${C.border};border-radius:10px;padding:18px">
        <h3 style="font-family:'Playfair Display',serif;font-size:16px;margin-bottom:14px">🏆 Most Watched</h3>
        ${topWatched.length===0
          ? `<div style="color:${C.muted};font-size:13px;text-align:center;padding-top:20px">Mark episodes as watched to see rankings</div>`
          : topWatched.map((s,i)=>`
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(37,37,64,0.2)">
              <span style="font-size:${i===0?18:13}px;width:22px;text-align:center">${i===0?"🏆":i+1}</span>
              ${coverHTML(s, 20)}
              <div style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.title}</div>
              <span style="color:${C.accent};font-size:13px;font-weight:700;white-space:nowrap">${s.episodesWatched} eps</span>
            </div>`).join("")}
      </div>
    </div>
  </div>`;
}

// ── Main Render ───────────────────────────────────────────────────────────────
function render() {
  const { user, tab, shows, addStep, disambigMatches } = state;
  const app = document.getElementById("app");
  if (!app) return;

  if (!user) { app.innerHTML = renderAuth(); return; }

  const watchingCount = shows.filter(s=>s.status==="Watching").length;
  const pausedCount = shows.filter(s=>s.status==="Paused").length;

  const tabs = [
    { id:"watching", label:"▶ Watching", badge: watchingCount },
    { id:"paused",   label:"⏸ Paused",   badge: pausedCount },
    { id:"shows",    label:"📺 All Shows", badge: 0 },
    { id:"detail",   label:"🔍 Show Detail", badge: 0 },
    { id:"watchlist",label:"🔖 Watchlist", badge: 0 },
    { id:"stats",    label:"📊 Stats", badge: 0 },
  ];

  let content = "";
  if (tab==="watching")  content = renderWatching();
  if (tab==="paused")    content = renderPaused();
  if (tab==="shows")     content = renderAllShows();
  if (tab==="detail")    content = renderDetail();
  if (tab==="watchlist") content = renderWatchlist();
  if (tab==="stats")     content = renderStats();

  app.innerHTML = `
    <div class="tab-bar">
      <div class="tab-inner">
        <span style="font-family:'Playfair Display',serif;font-size:20px;color:${C.accent};letter-spacing:1px;padding:14px 20px 14px 0;flex-shrink:0;border-right:1px solid ${C.border};margin-right:4px">SHOWLY</span>
        ${tabs.map(t=>`
          <button class="tab-btn ${tab===t.id?'active':''}" onclick="setState({tab:'${t.id}'})">
            ${t.label}
            ${t.badge>0?`<span class="tab-badge" style="background:${t.id==='paused'?C.purpleDim:C.accent};color:${t.id==='paused'?'#c39bd3':'#fff'}">${t.badge}</span>`:""}
          </button>`).join("")}
        <button onclick="signOut()" style="margin-left:auto;background:none;border:none;color:${C.muted};cursor:pointer;font-size:12px;padding:14px 8px;white-space:nowrap">Sign Out</button>
      </div>
    </div>
    <div class="content">${content}</div>
    ${renderPlatformModal()}
    ${renderPauseModal()}
    ${addStep==="disambig" ? renderAddFlow("") : ""}
  `;
}

async function signOut() {
  await sb.auth.signOut();
  setState({ user: null, shows: [] });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
sb.auth.getSession().then(({ data }) => {
  if (data.session?.user) {
    setState({ user: data.session.user });
    loadShows();
  } else {
    render();
  }
});

sb.auth.onAuthStateChange((_event, session) => {
  if (session?.user) {
    setState({ user: session.user });
    loadShows();
  } else {
    setState({ user: null, shows: [] });
  }
});
</script>
</body>
</html>
