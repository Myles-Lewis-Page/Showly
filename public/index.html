<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Show Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111;--surface:#1c1c1c;--surface2:#262626;--surface3:#303030;
  --border:#333;--accent:#e53e3e;--text:#f0f0f0;--muted:#888;--green:#38a169;
  --blue:#3182ce;--yellow:#d69e2e;--red:#e53e3e;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input{font-family:inherit;outline:none}
img{display:block}
.hide{display:none!important}

/* LOGIN */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.login-box{width:320px}
.login-box h1{font-size:28px;font-weight:700;margin-bottom:4px;color:var(--accent)}
.login-box p{color:var(--muted);font-size:14px;margin-bottom:28px}
.login-box label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.login-box input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:14px;margin-bottom:12px}
.login-box input:focus{border-color:var(--accent)}
.login-box .btn-submit{width:100%;background:var(--accent);color:#fff;border-radius:8px;padding:12px;font-size:15px;font-weight:600;margin-top:4px}
.login-box .btn-submit:hover{opacity:.9}
.login-err{color:var(--accent);font-size:13px;margin-top:8px;min-height:18px}

/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:8px;height:54px;position:sticky;top:0;z-index:50}
.nav-logo{font-size:18px;font-weight:700;color:var(--accent);margin-right:8px;white-space:nowrap}
.nav-tab{background:none;color:var(--muted);padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.nav-tab:hover{color:var(--text);background:var(--surface2)}
.nav-tab.on{color:var(--text);background:var(--surface2)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn-logout{background:none;color:var(--muted);font-size:13px;border:1px solid var(--border);border-radius:6px;padding:5px 12px}
.btn-logout:hover{color:var(--text)}

/* SEARCH BAR */
.search-wrap{padding:16px 20px;border-bottom:1px solid var(--border);position:relative}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--muted)}
.search-results{position:absolute;top:calc(100% - 0px);left:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;z-index:40;overflow:hidden}
.sr-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background .1s}
.sr-item:hover{background:var(--surface2)}
.sr-poster{width:32px;height:48px;border-radius:4px;object-fit:cover;background:var(--surface3);flex-shrink:0}
.sr-info{flex:1;min-width:0}
.sr-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-year{font-size:12px;color:var(--muted);margin-top:2px}
.sr-actions{display:flex;gap:6px;flex-shrink:0}
.btn-add{font-size:11px;padding:4px 10px;border-radius:99px;font-weight:600;border:none;cursor:pointer}
.btn-add.watching{background:#2d6a4f;color:#74c69d}
.btn-add.plan{background:#1a3a5c;color:#74b9ff}
.btn-add.paused{background:#44370b;color:#ffd60a}
.btn-add.dropped{background:#4a1010;color:#ff6b6b}
.btn-add:hover{opacity:.85}

/* MAIN */
main{padding:20px}
.section-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-label span{background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:1px 8px;font-size:11px}

/* SHOW CARDS */
.show-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:32px}
.show-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;transition:border-color .15s}
.show-card:hover{border-color:var(--border)}
.show-card .poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--surface2);display:block}
.show-card .poster-placeholder{width:100%;aspect-ratio:2/3;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:36px}
.show-card .card-body{padding:8px}
.show-card .card-title{font-size:13px;font-weight:500;line-height:1.3;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.show-card .card-year{font-size:11px;color:var(--muted)}
.show-card .card-actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.ca-btn{font-size:10px;padding:3px 7px;border-radius:99px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;transition:all .1s}
.ca-btn:hover{border-color:var(--muted);color:var(--text)}
.ca-btn.active-watching{border-color:#38a169;color:#38a169;background:rgba(56,161,105,.1)}
.ca-btn.active-plan{border-color:#3182ce;color:#3182ce;background:rgba(49,130,206,.1)}
.ca-btn.active-paused{border-color:#d69e2e;color:#d69e2e;background:rgba(214,158,46,.1)}
.ca-btn.active-dropped{border-color:#e53e3e;color:#e53e3e;background:rgba(229,62,62,.1)}
.ca-btn.del{color:#555;font-size:12px;padding:3px 6px}
.ca-btn.del:hover{color:#e53e3e;border-color:#e53e3e}
.status-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%}
.dot-watching{background:var(--green)}
.dot-plan{background:var(--blue)}
.dot-paused{background:var(--yellow)}
.dot-dropped{background:var(--red)}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.empty-icon{font-size:36px;margin-bottom:10px}

/* RECS */
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rec-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.rec-card .poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--surface2)}
.rec-card .poster-placeholder{width:100%;aspect-ratio:2/3;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:36px}
.rec-card .rec-body{padding:8px}
.rec-card .rec-title{font-size:13px;font-weight:500;line-height:1.3;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec-card .rec-meta{font-size:11px;color:var(--muted);margin-bottom:6px}
.rec-card .btn-rec-add{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px;font-size:12px;cursor:pointer}
.rec-card .btn-rec-add:hover{border-color:var(--accent);color:var(--accent)}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;z-index:999;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:500px){
  .nav-tab{padding:5px 8px;font-size:12px}
  .show-grid,.rec-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h1>Show Tracker</h1>
    <p>Track what you're watching</p>
    <label>Username</label>
    <input type="text" id="lu" autocomplete="username"/>
    <label>Password</label>
    <input type="password" id="lp" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="btn-submit" onclick="doLogin()">Sign in</button>
    <div class="login-err" id="lerr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <nav>
    <span class="nav-logo">📺 Shows</span>
    <button class="nav-tab on" onclick="setTab('watching')" id="t-watching">Watching</button>
    <button class="nav-tab" onclick="setTab('plan')" id="t-plan">Plan to Watch</button>
    <button class="nav-tab" onclick="setTab('paused')" id="t-paused">Paused</button>
    <button class="nav-tab" onclick="setTab('dropped')" id="t-dropped">Not Continuing</button>
    <button class="nav-tab" onclick="setTab('recs')" id="t-recs">Recommendations</button>
    <div class="nav-right">
      <button class="btn-logout" onclick="doLogout()">Sign out</button>
    </div>
  </nav>

  <!-- SEARCH (shown on all list tabs) -->
  <div class="search-wrap" id="search-wrap">
    <input type="text" id="search-input" placeholder="Search for a TV show to add..." autocomplete="off" oninput="onSearch(this.value)" onblur="setTimeout(closeSearch,200)"/>
    <div class="search-results hide" id="search-results"></div>
  </div>

  <main>
    <!-- WATCHING -->
    <div id="tab-watching">
      <div class="section-label">Currently Watching <span id="cnt-watching">0</span></div>
      <div class="show-grid" id="grid-watching"></div>
    </div>

    <!-- PLAN -->
    <div id="tab-plan" class="hide">
      <div class="section-label">Plan to Watch <span id="cnt-plan">0</span></div>
      <div class="show-grid" id="grid-plan"></div>
    </div>

    <!-- PAUSED -->
    <div id="tab-paused" class="hide">
      <div class="section-label">Paused <span id="cnt-paused">0</span></div>
      <div class="show-grid" id="grid-paused"></div>
    </div>

    <!-- DROPPED -->
    <div id="tab-dropped" class="hide">
      <div class="section-label">Not Continuing <span id="cnt-dropped">0</span></div>
      <div class="show-grid" id="grid-dropped"></div>
    </div>

    <!-- RECS -->
    <div id="tab-recs" class="hide">
      <div class="section-label">Recommended for You</div>
      <div class="rec-grid" id="grid-recs"></div>
    </div>
  </main>
</div>

<script>
const IMG = 'https://image.tmdb.org/t/p/w300';
let shows = []; // local cache
let currentTab = 'watching';
let searchTimer = null;

// ── API ───────────────────────────────────────────────────────────────────────
async function api(url, opts = {}) {
  const r = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  return r.json().catch(() => ({}));
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
async function doLogin() {
  const username = document.getElementById('lu').value.trim();
  const password = document.getElementById('lp').value;
  const res = await api('/api/login', { method: 'POST', body: { username, password } });
  if (res.ok) { startApp(); }
  else { document.getElementById('lerr').textContent = 'Wrong username or password'; }
}

async function doLogout() {
  await api('/api/logout', { method: 'POST' });
  location.reload();
}

async function init() {
  const res = await api('/api/me');
  if (res.ok) startApp();
}

// ── APP ───────────────────────────────────────────────────────────────────────
async function startApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').classList.remove('hide');
  await loadShows();
}

async function loadShows() {
  shows = await api('/api/shows');
  renderAll();
}

function renderAll() {
  const groups = { watching: [], plan: [], paused: [], dropped: [] };
  shows.forEach(s => { if (groups[s.status]) groups[s.status].push(s); });
  Object.entries(groups).forEach(([status, list]) => {
    document.getElementById('cnt-' + status).textContent = list.length;
    const grid = document.getElementById('grid-' + status);
    if (!list.length) {
      grid.innerHTML = `<div class="empty"><div class="empty-icon">${statusIcon(status)}</div>Nothing here yet</div>`;
      return;
    }
    grid.innerHTML = list.map(s => showCard(s)).join('');
  });
}

function showCard(s) {
  const poster = s.poster_path
    ? `<img class="poster" src="${IMG}${s.poster_path}" alt="${esc(s.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="poster-placeholder" style="display:none">📺</div>`
    : `<div class="poster-placeholder">📺</div>`;
  return `<div class="show-card" id="card-${s.id}">
    <div class="status-dot dot-${s.status}"></div>
    ${poster}
    <div class="card-body">
      <div class="card-title">${esc(s.title)}</div>
      <div class="card-year">${s.year || ''}</div>
      <div class="card-actions">
        <button class="ca-btn ${s.status==='watching'?'active-watching':''}" onclick="setStatus(${s.id},'watching')">▶ Watching</button>
        <button class="ca-btn ${s.status==='plan'?'active-plan':''}" onclick="setStatus(${s.id},'plan')">📋 Plan</button>
        <button class="ca-btn ${s.status==='paused'?'active-paused':''}" onclick="setStatus(${s.id},'paused')">⏸ Paused</button>
        <button class="ca-btn ${s.status==='dropped'?'active-dropped':''}" onclick="setStatus(${s.id},'dropped')">🚫 Drop</button>
        <button class="ca-btn del" onclick="deleteShow(${s.id})" title="Remove">✕</button>
      </div>
    </div>
  </div>`;
}

function statusIcon(s) {
  return { watching: '▶️', plan: '📋', paused: '⏸️', dropped: '🚫' }[s] || '📺';
}

// ── STATUS CHANGE (no re-render, update in place) ─────────────────────────────
async function setStatus(id, newStatus) {
  const res = await api(`/api/shows/${id}`, { method: 'PATCH', body: { status: newStatus } });
  if (!res.id) return;

  // Update local cache
  const show = shows.find(s => s.id === id);
  if (!show) return;
  show.status = newStatus;

  // Move card to correct grid — remove from current, insert into new
  const card = document.getElementById('card-' + id);
  if (card) card.remove();

  // Re-render just the two affected grids
  renderGrid(newStatus);
  // Also re-render the old grid it came from (we don't know which, so re-render all counts)
  renderAll();

  toast(statusLabel(newStatus));
}

async function deleteShow(id) {
  await api(`/api/shows/${id}`, { method: 'DELETE' });
  shows = shows.filter(s => s.id !== id);
  const card = document.getElementById('card-' + id);
  if (card) card.remove();
  renderAll();
  toast('Removed');
}

function renderGrid(status) {
  const list = shows.filter(s => s.status === status);
  document.getElementById('cnt-' + status).textContent = list.length;
  const grid = document.getElementById('grid-' + status);
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">${statusIcon(status)}</div>Nothing here yet</div>`;
  } else {
    grid.innerHTML = list.map(s => showCard(s)).join('');
  }
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function setTab(tab) {
  currentTab = tab;
  ['watching','plan','paused','dropped','recs'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('hide', t !== tab);
    document.getElementById('t-' + t).classList.toggle('on', t === tab);
  });
  document.getElementById('search-wrap').classList.toggle('hide', tab === 'recs');
  if (tab === 'recs') loadRecs();
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function onSearch(q) {
  clearTimeout(searchTimer);
  const res = document.getElementById('search-results');
  if (!q.trim()) { res.classList.add('hide'); return; }
  searchTimer = setTimeout(() => doSearch(q), 300);
}

async function doSearch(q) {
  const results = await api('/api/search?q=' + encodeURIComponent(q));
  const res = document.getElementById('search-results');
  if (!results.length) { res.classList.add('hide'); return; }

  res.innerHTML = results.map(r => {
    const inList = shows.some(s => s.tmdb_id === r.tmdb_id);
    const posterEl = r.poster_path
      ? `<img class="sr-poster" src="${IMG}${r.poster_path}" alt=""/>`
      : `<div class="sr-poster" style="display:flex;align-items:center;justify-content:center">📺</div>`;
    return `<div class="sr-item">
      ${posterEl}
      <div class="sr-info">
        <div class="sr-title">${esc(r.title)}</div>
        <div class="sr-year">${r.year || ''}</div>
      </div>
      <div class="sr-actions">
        ${inList
          ? `<span style="font-size:11px;color:var(--muted);padding:4px 8px">Added ✓</span>`
          : `<button class="btn-add watching" onmousedown="addShow(event,${JSON.stringify(r).replace(/"/g,'&quot;')},'watching')">▶ Watching</button>
             <button class="btn-add plan" onmousedown="addShow(event,${JSON.stringify(r).replace(/"/g,'&quot;')},'plan')">📋 Plan</button>`
        }
      </div>
    </div>`;
  }).join('');
  res.classList.remove('hide');
}

function closeSearch() {
  document.getElementById('search-results').classList.add('hide');
}

async function addShow(event, show, status) {
  event.preventDefault();
  const res = await api('/api/shows', { method: 'POST', body: { ...show, status } });
  if (res.id) {
    const existing = shows.findIndex(s => s.tmdb_id === res.tmdb_id);
    if (existing >= 0) shows[existing] = res;
    else shows.unshift(res);
    renderAll();
    toast(`Added to ${statusLabel(status)}`);
  }
  closeSearch();
  document.getElementById('search-input').value = '';
}

// ── RECOMMENDATIONS ───────────────────────────────────────────────────────────
async function loadRecs() {
  const grid = document.getElementById('grid-recs');
  grid.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div>Loading recommendations...</div>';
  const recs = await api('/api/recommendations');
  if (!recs.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">🤷</div>Add some shows first to get recommendations</div>';
    return;
  }
  grid.innerHTML = recs.map(r => {
    const posterEl = r.poster_path
      ? `<img class="poster" src="${IMG}${r.poster_path}" alt="${esc(r.title)}" loading="lazy"/>`
      : `<div class="poster-placeholder">📺</div>`;
    return `<div class="rec-card">
      ${posterEl}
      <div class="rec-body">
        <div class="rec-title">${esc(r.title)}</div>
        <div class="rec-meta">${r.year || ''}${r.rating ? ` · ⭐ ${r.rating.toFixed(1)}` : ''}</div>
        <button class="btn-rec-add" onclick="addRecShow(this,${JSON.stringify(r).replace(/"/g,'&quot;')})">+ Add to Watching</button>
      </div>
    </div>`;
  }).join('');
}

async function addRecShow(btn, show) {
  btn.textContent = 'Adding...';
  btn.disabled = true;
  const res = await api('/api/shows', { method: 'POST', body: { ...show, status: 'watching' } });
  if (res.id) {
    const existing = shows.findIndex(s => s.tmdb_id === res.tmdb_id);
    if (existing >= 0) shows[existing] = res;
    else shows.unshift(res);
    renderAll();
    btn.textContent = '✓ Added';
    toast('Added to Watching');
  } else {
    btn.textContent = '+ Add to Watching';
    btn.disabled = false;
  }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function statusLabel(s) {
  return { watching: 'Watching ▶', plan: 'Plan to Watch 📋', paused: 'Paused ⏸', dropped: 'Not Continuing 🚫' }[s] || s;
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

init();
</script>
</body>
</html>
