<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Show Tracker</title>
<link rel="stylesheet" href="/styles.css"/>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h1>Show Tracker</h1>
    <p>Track what you're watching</p>
    <label>Username</label><input type="text" id="lu" autocomplete="username"/>
    <label>Password</label><input type="password" id="lp" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="btn-submit" onclick="doLogin()">Sign in</button>
    <div class="login-err" id="lerr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <nav>
    <span class="nav-logo">📺</span>
    <button class="nav-tab on" onclick="setTab('watching')" id="t-watching">Watching</button>
    <button class="nav-tab" onclick="setTab('caughtup')" id="t-caughtup">Caught Up</button>
    <button class="nav-tab" onclick="setTab('finished')" id="t-finished">Show Finished</button>
    <button class="nav-tab" onclick="setTab('watchlist')" id="t-watchlist">Watchlist</button>
    <button class="nav-tab" onclick="setTab('paused')" id="t-paused">Paused</button>
    <button class="nav-tab" onclick="setTab('dropped')" id="t-dropped">Not Continuing</button>
    <button class="nav-tab" onclick="setTab('recs')" id="t-recs">Discover</button>
    <button class="nav-tab" onclick="setTab('stats')" id="t-stats">Stats</button>
    <button class="nav-tab" onclick="setTab('settings')" id="t-settings">⚙ Settings</button>
    <div class="nav-right"><button class="btn-logout" onclick="doLogout()">Sign out</button></div>
  </nav>

  <div class="search-wrap" id="search-wrap">
    <input type="text" id="search-input" placeholder="Search for a TV show to add..." autocomplete="off"
      oninput="onSearch(this.value)" onblur="setTimeout(closeSearch,200)"/>
    <div class="search-results hide" id="search-results"></div>
  </div>

  <main>
    <div id="tab-watching">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="section-label" style="margin-bottom:0">Currently Watching <span id="cnt-watching">0</span></div>
        <div style="display:flex;gap:6px">
          <button class="sort-btn on" id="sort-alpha" onclick="setSort('alpha')">A–Z</button>
          <button class="sort-btn" id="sort-updated" onclick="setSort('updated')">Recent</button>
          <button class="sort-btn" id="sort-remaining" onclick="setSort('remaining')">Most Left</button>
        </div>
      </div>
      <div class="show-grid" id="grid-watching"></div>
      <div id="upcoming-section" style="margin-top:24px">
        <div class="section-label">Upcoming <span id="cnt-upcoming">0</span></div>
        <div class="show-grid" id="grid-upcoming"></div>
      </div>
    </div>
    <div id="tab-caughtup" class="hide">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="section-label" style="margin-bottom:0">Caught Up <span id="cnt-caughtup">0</span></div>
        <div class="sort-btns-shared"></div>
      </div>
      <div class="show-grid" id="grid-caughtup"></div>
    </div>
    <div id="tab-finished" class="hide">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="section-label" style="margin-bottom:0">Show Finished <span id="cnt-finished">0</span></div>
        <div class="sort-btns-shared"></div>
      </div>
      <div class="show-grid" id="grid-finished"></div>
    </div>
    <div id="tab-watchlist" class="hide">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="section-label" style="margin-bottom:0">Watchlist <span id="cnt-watchlist">0</span></div>
        <div class="sort-btns-shared"></div>
      </div>
      <div class="show-grid" id="grid-watchlist"></div>
    </div>
    <div id="tab-paused" class="hide">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="section-label" style="margin-bottom:0">Paused <span id="cnt-paused">0</span></div>
        <div class="sort-btns-shared"></div>
      </div>
      <div class="show-grid" id="grid-paused"></div>
    </div>
    <div id="tab-dropped" class="hide">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="section-label" style="margin-bottom:0">Not Continuing <span id="cnt-dropped">0</span></div>
        <div class="sort-btns-shared"></div>
      </div>
      <div class="show-grid" id="grid-dropped"></div>
    </div>
    <div id="tab-recs" class="hide">
      <div class="section-label">Discover Shows</div>
      <div id="discover-filter-row" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px"></div>
      <div class="rec-grid" id="grid-recs"></div>
    </div>
    <div id="tab-stats" class="hide" style="max-width:680px"><div class="section-label">Your Stats</div><div id="stats-content"></div></div>
    <div id="tab-settings" class="hide" style="max-width:500px"><div class="section-label">Settings</div><div id="settings-content"></div></div>
  </main>
</div>

<!-- DETAIL PANEL -->
<div id="detail-overlay" onclick="closeDetail()"></div>
<div id="detail-panel"><div id="detail-content"></div></div>

<!-- EP MODAL -->
<div id="ep-modal" class="hide" onclick="if(event.target===this)closeEpModal()">
  <div class="ep-modal-box" id="ep-modal-content"></div>
</div>

<!-- REC MODAL -->
<div id="rec-modal" class="hide" onclick="if(event.target===this)closeRecModal()">
  <div class="rec-modal-box" id="rec-modal-content"></div>
</div>

<script src="/app.js"></script>
<script src="/shows.js"></script>
<script src="/detail.js"></script>
<script src="/stats.js"></script>
<script src="/discover.js"></script>
</body>
</html>
